<text class="s" x="300" y="4">system bus (P1 + P2)</text>
<rect class="ink paper" x="305" y="30" width="100" height="30"/>
<text class="b" x="355" y="49.3" text-anchor="middle">bus interface</text>
<text class="s" x="420" y="49">posted writes; WAIT on reads</text>
