<path class="solid" d="M530 50 L532.6 56 L527.4 56Z"/>
<path class="solid" d="M530 130 L527.4 124 L532.6 124Z"/>
<path class="ink wire" d="M200 285 L30 285 L30 25 L200 25"/>
<path class="solid" d="M200 25 L194 27.6 L194 22.4Z"/>
<path class="solid" d="M200 285 L194 287.6 L194 282.4Z"/>
