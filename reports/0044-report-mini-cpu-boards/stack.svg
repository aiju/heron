<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="22 -8 586 326" width="586" height="326"><style>.diagram{--paper:#FBFAF6;--ink:#171615;--ink-2:#56524B;--ink-3:#8C877D;--rule:#E4E0D8;--spot:#A3195B}
@media (prefers-color-scheme:dark){.diagram{--paper:#141312;--ink:#ECE7DE;--ink-2:#ADA79C;--ink-3:#7E786E;--rule:#2C2926;--spot:#E8609F}}
.diagram text{fill:var(--ink);font-family:'Libre Franklin','Franklin Gothic Medium','Helvetica Neue',Arial,sans-serif;font-size:12px}
.diagram .ink{fill:none;stroke:var(--ink);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.diagram .thin{fill:none;stroke:var(--ink-2);stroke-width:.9}
.diagram .faint{fill:none;stroke:var(--ink-3);stroke-width:.7}
.diagram .dotted{fill:none;stroke:var(--ink-3);stroke-width:.7;stroke-dasharray:1.5 2}
.diagram .dashed{stroke-dasharray:4 3}
.diagram .bus{stroke-width:3.2;stroke-linecap:butt}
.diagram .grid{stroke:var(--rule);stroke-width:1}
.diagram .spot{fill:none;stroke:var(--spot);stroke-width:1.1}
.diagram .paper{fill:var(--paper)}.diagram .hatch{fill:url(#diagram-hatch)}.diagram #diagram-hatch line{stroke:var(--ink-3);stroke-width:.8}
.diagram .solid{fill:var(--ink)}.diagram .solid-2{fill:var(--ink-2)}.diagram .solid-spot{fill:var(--spot)}
.diagram .b{font-weight:600}.diagram .m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.diagram .s{font-size:11px;fill:var(--ink-2)}.diagram .xs{font-size:10px;fill:var(--ink-3)}.diagram .sp{fill:var(--spot)}
.diagram .halo{paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}</style><defs><pattern id="diagram-hatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)"><line x1="2" y1="0" x2="2" y2="4"/></pattern></defs>
<rect class="paper" x="22" y="-8" width="586" height="326"/>
<rect class="ink paper" x="200" y="0" width="400" height="50"/>
<text class="b" x="400" y="21.8" text-anchor="middle">io (later)</text>
<text class="s" x="400" y="36.5" text-anchor="middle">video, bank 1, I/O devices</text>
<rect class="ink paper" x="200" y="130" width="400" height="50"/>
<text class="b" x="400" y="151.8" text-anchor="middle">cpu2: 160 chips</text>
<text class="s" x="400" y="166.5" text-anchor="middle">datapath, register file, memory</text>
<rect class="ink paper" x="200" y="260" width="400" height="50"/>
<text class="b" x="400" y="281.8" text-anchor="middle">cpu1: 109 chips</text>
<text class="s" x="400" y="296.5" text-anchor="middle">sequencer, clock, control store</text>
