<path class="solid" d="M217.5 60 L214.9 54 L220.1 54Z"/>
<path class="ink wire" d="M405 26.5 L405 60"/>
<path class="solid" d="M405 60 L402.4 54 L407.6 54Z"/>
<path class="ink wire" d="M74 100 L140 100"/>
<path class="solid" d="M140 100 L134 102.6 L134 97.4Z"/>
<path class="ink wire" d="M235 140 L235 180"/>
<path class="solid" d="M235 180 L232.4 174 L237.6 174Z"/>
<path class="ink wire" d="M410 140 L410 180"/>
<path class="solid" d="M410 180 L407.4 174 L412.6 174Z"/>
<path class="ink wire" d="M490 260 L490 290"/>
<path class="solid" d="M490 290 L487.4 284 L492.6 284Z"/>
<path class="ink wire" d="M490 350 L490 380"/>
<path class="solid" d="M490 380 L487.4 374 L492.6 374Z"/>
<text class="s halo" x="107" y="96" text-anchor="middle">doorbells</text>
</svg>
