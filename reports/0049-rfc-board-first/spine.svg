<text class="s" x="425" y="139" text-anchor="middle">4 MB, crossbar</text>
<text class="s" x="425" y="154" text-anchor="middle">MAR, FPC</text>
<rect class="ink paper" x="510" y="100" width="130" height="70"/>
<text class="b" x="575" y="124.3" text-anchor="middle">IO + VIDEO</text>
<text class="s" x="575" y="139" text-anchor="middle">devices</text>
<text class="s" x="575" y="154" text-anchor="middle">frame buffer</text>
