<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heron Opcode Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  /* Layout: a printed opcode reference card. The 16×16 map is the page; an inspector and a tabbed catalog sit to its right */
  --bg: #eef1f5;
  --panel: #fbfcfd;
  --ink: #141a22;
  --muted: #566173;
  --faint: #8a94a4;
  --line: #d6dce4;
  --line-2: #b4bdca;
  --hover: #e3e8ef;
  --bad: #b42318;
  --warn: #a15c07;
  --ok: #067647;
  --info: #3456b0;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-ui: "Barlow", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --g-alu-bg: #dce6fb; --g-alu-bd: #7d9ad8;
  --g-mov-bg: #d4efe8; --g-mov-bd: #4fa892;
  --g-muldiv-bg: #e7defa; --g-muldiv-bd: #9479d4;
  --g-bits-bg: #f8e9c4; --g-bits-bd: #c99a2e;
  --g-unary-bg: #e0efd2; --g-unary-bd: #78a64f;
  --g-ctrl-bg: #f9dbe2; --g-ctrl-bd: #cf6680;
  --g-sys-bg: #e1e5ec; --g-sys-bd: #8590a3;
  --g-block-bg: #fbdfcc; --g-block-bd: #d9834a;
  --g-tag-bg: #f4daef; --g-tag-bd: #b95ba4;
  --g-esc-bg: #d4ecf6; --g-esc-bd: #3b97be;
  --fc0: #3456b0; --fc1: #0f766e; --fc2: #a15c07; --fc3: #9b2c8f; --fc4: #4d7c0f; --fc5: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --panel: #151a21; --ink: #e6ebf2; --muted: #9ba6b6; --faint: #677285;
    --line: #252c37; --line-2: #3a4352; --hover: #1e242d;
    --bad: #f97066; --warn: #f5b546; --ok: #4cc38a; --info: #86a8ff;
    --g-alu-bg: #1c2944; --g-alu-bd: #4c6cb5;
    --g-mov-bg: #133430; --g-mov-bd: #2f8f78;
    --g-muldiv-bg: #2a2246; --g-muldiv-bd: #7459c0;
    --g-bits-bg: #3a2f12; --g-bits-bd: #a9821f;
    --g-unary-bg: #1f3019; --g-unary-bd: #5b8d38;
    --g-ctrl-bg: #3d1c26; --g-ctrl-bd: #b04d68;
    --g-sys-bg: #232933; --g-sys-bd: #687489;
    --g-block-bg: #3d2516; --g-block-bd: #bb6630;
    --g-tag-bg: #391a35; --g-tag-bd: #9e4689;
    --g-esc-bg: #12303d; --g-esc-bd: #2a7ea2;
    --fc0: #86a8ff; --fc1: #4fd1c5; --fc2: #f5b546; --fc3: #e57bd4; --fc4: #9bd36a; --fc5: #f97066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --panel: #151a21; --ink: #e6ebf2; --muted: #9ba6b6; --faint: #677285;
  --line: #252c37; --line-2: #3a4352; --hover: #1e242d;
  --bad: #f97066; --warn: #f5b546; --ok: #4cc38a; --info: #86a8ff;
  --g-alu-bg: #1c2944; --g-alu-bd: #4c6cb5;
  --g-mov-bg: #133430; --g-mov-bd: #2f8f78;
  --g-muldiv-bg: #2a2246; --g-muldiv-bd: #7459c0;
  --g-bits-bg: #3a2f12; --g-bits-bd: #a9821f;
  --g-unary-bg: #1f3019; --g-unary-bd: #5b8d38;
  --g-ctrl-bg: #3d1c26; --g-ctrl-bd: #b04d68;
  --g-sys-bg: #232933; --g-sys-bd: #687489;
  --g-block-bg: #3d2516; --g-block-bd: #bb6630;
  --g-tag-bg: #391a35; --g-tag-bd: #9e4689;
  --g-esc-bg: #12303d; --g-esc-bd: #2a7ea2;
  --fc0: #86a8ff; --fc1: #4fd1c5; --fc2: #f5b546; --fc3: #e57bd4; --fc4: #9bd36a; --fc5: #f97066;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.4 var(--font-ui); }
#app { height: 100%; }
.boot { padding: 24px 16px; color: var(--muted); }
.app {
  height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px;
}
.mono { font-family: var(--font-mono); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.brand { margin: 0; font: 600 23px/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; }
.maps, .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.spacer { flex: 1; }
.save { font-size: 12px; color: var(--muted); }
.save.bad { color: var(--bad); font-weight: 600; }

/* controls */
.btn { font: 500 13px/1.2 var(--font-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink); opacity: .86; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 2px 8px; font-size: 12px; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
.inp { font: 400 14px/1.3 var(--font-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 8px; width: 100%; min-width: 0; }
.inp.mono { font-family: var(--font-mono); font-size: 13px; }
select.inp { padding: 5px 6px; }
textarea.inp { resize: vertical; }
.seg { display: inline-flex; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.seg > span { margin-right: 6px; }
.seg button { font: 500 12px/1.2 var(--font-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); padding: 5px 9px; cursor: pointer; }
.seg button + button { border-left: 0; }
.seg button:first-of-type { border-radius: 4px 0 0 4px; }
.seg button:last-of-type { border-radius: 0 4px 4px 0; }
.seg button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.row { display: flex; align-items: center; }
.gap { gap: 6px; flex-wrap: wrap; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 4px 0; color: var(--ink); }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.facts { font-size: 12.5px; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; margin: 6px 0; }
.lbl { font: 600 12.5px/1.2 var(--font-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* layout */
.main {
  flex: 1; min-height: 0; display: grid; gap: 14px; padding-top: 12px;
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "grid insp" "grid side";
}
.gp { grid-area: grid; min-width: 0; min-height: 0; overflow: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.insp { grid-area: insp; max-height: 54vh; overflow: auto; }
.side { grid-area: side; min-height: 0; overflow: auto; padding-top: 0; }
@media (min-width: 1680px) {
  .main { grid-template-columns: minmax(0, 1fr) 360px 340px; grid-template-rows: minmax(0, 1fr); grid-template-areas: "grid insp side"; }
  .insp { max-height: none; }
}
@media (max-width: 1020px) {
  html, body, #app, .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "grid" "insp" "side"; }
  .gp, .insp, .side { overflow: visible; max-height: none; }
}

/* the grid */
.gtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.gtabs button { font: 500 13px var(--font-ui); color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
.gtabs button:hover { color: var(--ink); }
.gtabs button.on { color: var(--ink); background: var(--panel); border-color: var(--line-2); }
.gtabs small { font: 400 11px var(--font-mono); color: var(--faint); margin-left: 6px; }
.gwrap { overflow-x: auto; padding: 3px; }
.grid {
  display: grid; gap: 3px; min-width: 840px;
  grid-template-columns: 30px repeat(16, minmax(48px, 1fr));
  grid-template-rows: 22px; grid-auto-rows: 52px;
}
.colh, .corner { display: flex; align-items: flex-end; justify-content: center; font: 500 11px var(--font-mono); color: var(--muted); padding-bottom: 2px; }
.rowh { font: 600 12px var(--font-mono); color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 3px; cursor: pointer; padding: 0; }
.rowh:hover { background: var(--hover); color: var(--ink); }
.rowh.on { background: var(--ink); color: var(--panel); }
.rowh.drop, .cell.drop { box-shadow: 0 0 0 2px var(--info); }
.cell {
  position: relative; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 3px 5px 4px; border-radius: 3px; border: 1px solid var(--c-bd, var(--line)); background: var(--c-bg, var(--panel));
  cursor: pointer; overflow: hidden; font-family: var(--font-mono); color: var(--ink);
}
.cell.empty { --c-bd: var(--line); --c-bg: var(--panel); }
.cell.empty:hover { --c-bg: var(--hover); }
.cell .code { position: absolute; top: 2px; left: 5px; font-size: 9.5px; color: var(--muted); }
.cell.empty .code { color: var(--faint); }
.cell .len { position: absolute; top: 2px; right: 5px; font-size: 9.5px; color: var(--muted); }
.cell .mn { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
.cell .md { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; line-height: 1.25; }
.cell.wide { justify-content: center; align-items: center; }
.cell.wide .mn { font-size: 13px; }
.cell.wide .syn { font-weight: 400; }
.cell.sel { box-shadow: 0 0 0 2px var(--ink); z-index: 1; }
.cell.bad::after { content: ""; position: absolute; bottom: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.cell.ext { --c-bd: var(--line-2); background: repeating-linear-gradient(135deg, var(--panel) 0 5px, var(--hover) 5px 10px); }
.cell.ext .mn { font: 600 14px/1.1 var(--font-display); letter-spacing: .06em; }
@media (prefers-reduced-motion: no-preference) { .cell, .rowh { transition: box-shadow .12s, background-color .12s; } }

.g-alu { --c-bg: var(--g-alu-bg); --c-bd: var(--g-alu-bd); }
.g-mov { --c-bg: var(--g-mov-bg); --c-bd: var(--g-mov-bd); }
.g-muldiv { --c-bg: var(--g-muldiv-bg); --c-bd: var(--g-muldiv-bd); }
.g-bits { --c-bg: var(--g-bits-bg); --c-bd: var(--g-bits-bd); }
.g-unary { --c-bg: var(--g-unary-bg); --c-bd: var(--g-unary-bd); }
.g-ctrl { --c-bg: var(--g-ctrl-bg); --c-bd: var(--g-ctrl-bd); }
.g-sys { --c-bg: var(--g-sys-bg); --c-bd: var(--g-sys-bd); }
.g-block { --c-bg: var(--g-block-bg); --c-bd: var(--g-block-bd); }
.g-tag { --c-bg: var(--g-tag-bg); --c-bd: var(--g-tag-bd); }
.g-esc { --c-bg: var(--g-esc-bg); --c-bd: var(--g-esc-bd); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c-bg); border: 1px solid var(--c-bd); flex: none; }

/* summary under the grid */
.sum { margin-top: 12px; display: grid; gap: 8px; }
.bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; background: var(--c-bd, var(--line-2)); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend b { font: 600 11px var(--font-mono); color: var(--ink); }
.checks { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 1px; font-size: 13px; }
.checks li { display: flex; gap: 10px; align-items: baseline; padding: 3px 6px; border-radius: 3px; cursor: pointer; }
.checks li:hover { background: var(--hover); }
.checks .where { font: 500 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.lvl { font: 600 11px var(--font-display); text-transform: uppercase; letter-spacing: .08em; width: 40px; flex: none; }
.lvl.bad { color: var(--bad); }
.lvl.warn { color: var(--warn); }
.lvl.info { color: var(--info); }

/* inspector */
.ihead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.addr { font: 600 13px var(--font-mono); }
.wi { position: relative; }
.sug { list-style: none; margin: 4px 0 0; padding: 4px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel); display: grid; gap: 1px; max-height: 300px; overflow: auto; }
.sug li { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 3px; cursor: pointer; font-size: 13px; min-width: 0; }
.sug li.on, .sug li:hover { background: var(--hover); }
.sug li.none { cursor: default; color: var(--muted); }
.sug .cells { font: 500 11px var(--font-mono); color: var(--warn); white-space: nowrap; }
.sug .xb { padding: 1px 6px; font-size: 11px; }
.sug b { font: 600 12.5px var(--font-mono); }
.syn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.srcs { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 500 11px/1.45 var(--font-ui); padding: 0 6px; border-radius: 3px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.chip.st-recommended { color: var(--ok); border-color: var(--ok); }
.chip.st-measured { color: var(--info); border-color: var(--info); }
.chip.st-notrec { color: var(--warn); border-color: var(--warn); }
.chip.st-rejected { color: var(--bad); border-color: var(--bad); }
.plt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mnbig { font: 600 20px var(--font-mono); }
.desc { margin: 6px 0; font-size: 13.5px; }
.desc.small { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.ref { color: var(--muted); font-size: 12px; white-space: nowrap; }
.fld { display: grid; gap: 4px; margin: 10px 0; font-size: 12.5px; color: var(--muted); }
.mp { display: flex; gap: 6px; min-width: 0; }
.mp .sz { width: 96px; flex: none; }
.mp .tb { width: 170px; flex: none; }
.enc { margin: 12px 0; display: grid; gap: 6px; }
.parcel { display: grid; gap: 3px; }
.phex { font: 600 13px var(--font-mono); letter-spacing: .08em; }
.phex small { font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 10px; }
.bits { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)) 6px repeat(8, minmax(0, 1fr)); gap: 2px; }
.bit { font: 600 11px/20px var(--font-mono); text-align: center; border-radius: 2px; background: var(--bg); color: var(--muted); }
.bit.f { background: var(--fc); color: var(--panel); }
.bit.u { color: var(--faint); font-weight: 400; }
.bytecap { display: grid; grid-template-columns: 1fr 6px 1fr; gap: 2px; font-size: 11px; color: var(--muted); text-align: center; }
.xp { font: 500 12px var(--font-mono); color: var(--muted); padding: 3px 7px; border: 1px dashed var(--line-2); border-radius: 3px; }
.fkeys { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 11.5px var(--font-mono); color: var(--muted); }
.fkeys span { display: inline-flex; gap: 5px; align-items: center; }
.fkeys i { width: 9px; height: 9px; border-radius: 2px; background: var(--fc); display: inline-block; }
.probs { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.probs li { padding: 5px 8px; border-radius: 3px; background: var(--bg); }
.probs .bad { color: var(--bad); }
.probs .warn { color: var(--warn); }
.probs .info { color: var(--info); }
.conf { padding: 10px; border: 1px solid var(--warn); border-radius: 4px; display: grid; gap: 8px; font-size: 13px; margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.grid2 > label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); align-content: start; }
.grid2 small { font-size: 11.5px; }
.span2 { grid-column: 1 / -1; }
.plan { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 1px; font-size: 12.5px; }
.plan li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 6px; padding: 2px 4px; border-radius: 2px; }
.plan .pc { font-family: var(--font-mono); color: var(--muted); }
.plan .pm { font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .ps { color: var(--muted); font-size: 12px; text-align: right; }
.plan .s-ok .ps { color: var(--ok); }
.plan .s-busy .ps { color: var(--warn); }
.plan .s-illegal, .plan .s-wide, .plan .s-empty { opacity: .55; }
.chosen { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); }
.chosen b { font-family: var(--font-mono); }
.link { background: none; border: 0; padding: 0; color: var(--info); font: inherit; cursor: pointer; text-decoration: underline; }

/* sidebar */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 -14px 10px; padding: 0 8px; position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { font: 600 13.5px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 8px 8px; cursor: pointer; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.filters { display: grid; gap: 6px; margin-bottom: 4px; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px; }
.toggles button { font: 500 12px var(--font-ui); padding: 2px 8px; border-radius: 3px; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); cursor: pointer; }
.toggles button.off { background: transparent; color: var(--muted); border-color: var(--line-2); text-decoration: line-through; }
.gh { font: 600 12.5px var(--font-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; display: flex; align-items: center; gap: 7px; }
.cat { list-style: none; margin: 0; padding: 0; }
.ci { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 5px 6px; border-radius: 3px; cursor: pointer; }
.ci:hover { background: var(--hover); }
.ci .top1 { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.ci .top1 b { font: 600 13px var(--font-mono); white-space: nowrap; }
.ci .top1 .syn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci .cd { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci.open .cd { white-space: normal; }
.ci .cr { display: flex; gap: 4px; align-items: center; padding-top: 1px; }
.ci.dim { opacity: .6; }
.used { font: 600 11px var(--font-mono); color: var(--ink); }
.mt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.mt td, .mt th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.mt th { font: 600 11.5px var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.mt td.mono { font-size: 12px; white-space: nowrap; }
.mt td.n { font-family: var(--font-mono); font-size: 12px; text-align: right; }
.mt tr.sub td { font: 600 11.5px var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-top: 10px; }
.slots { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 3px; }

const HEX = '0123456789ABCDEF';

const D1 = ['1a', '1b'];

/* ------------------------------------------------------------------ */

/* f: operand fields in the first parcel, name:bits, in fill order     */
/* ea: takes an addressing mode (any, mem, addr, value)                */
/* ------------------------------------------------------------------ */
const GROUPS = [
  ['alu', 'ALU'], ['mov', 'Moves and memory'], ['muldiv', 'Multiply and divide'], ['bits', 'Shifts and bits'],
  ['unary', 'Unary'], ['ctrl', 'Branches and calls'], ['sys', 'System'], ['block', 'Block and multiple'],
  ['tag', 'Tagged'], ['esc', 'Escapes'],
];
const SRCS = [['1a', '1a'], ['1b', '1b'], ['v1bs', 'v1bs'], ['v1bx', 'v1bx'], ['rfc', 'RFC'], ['custom', 'yours']];
const SRCL = Object.fromEntries(SRCS);
const STL = { adopted: 'draft 1', recommended: 'recommended', measured: 'measured', open: 'open', notrec: 'not recommended', rejected: 'rejected', alias: 'alias', custom: 'yours' };

const C = [];
const I = (id, m, syn, f, o = {}) => C.push({ id, m, syn, f, ea: null, ext: 0, xl: '', g: 'alu', src: D1, st: 'adopted', d: '', ...o });

[
  ['add', 'ADD', 'rd ← rd + src'],
  ['adc', 'ADC', 'rd ← rd + src + C, with a sticky Z for 64-bit chains. 1b: registers only'],
  ['sub', 'SUB', 'rd ← rd − src'],
  ['sbc', 'SBC', 'rd ← rd − src − !C, sticky Z. 1b: registers only'],
  ['and', 'AND', 'rd ← rd & src'],
  ['or', 'OR', 'rd ← rd | src'],

  ['tst', 'TST', 'Flags of rd & src. 1b: registers only'],
].forEach(([id, m, d]) => I(id, m, 'rd, ea', 'rd:4', { ea: 'any', d }));
I('mov', 'MOV', 'rd, ea', 'rd:4', { ea: 'any', g: 'mov', d: 'rd ← src: a load, a copy or a constant; sets N and Z. 1a spells the loads LD, LDB, LDH, LDSB, LDSH' });
I('movs', 'MOVS', 'rd, ea', 'rd:4', { ...RFC, ea: 'any', g: 'mov', d: 'rd ← src, setting N and Z (ARM’s S suffix), for a MOV that leaves the flags alone. Loads followed by a branch on N or Z: 5.0% of hand-written and 1.9% of compiled instructions, mostly byte [R]+ (string loops) and [R] (null links)' });
I('st', 'ST', 'rs, ea', 'rs:4', { ea: 'mem', wr: true, g: 'mov', d: 'Store rs at the operand, at the operand’s size. 1a: ST, STB, STH' });

[
  ['mulu', 'MULU', 'r0:rd ← rd × src, unsigned'],
  ['muls', 'MULS', 'r0:rd ← rd × src, signed'],
  ['divu', 'DIVU', 'rd ← rd ÷ src, r0 ← remainder, unsigned'],
  ['divs', 'DIVS', 'rd ← rd ÷ src toward zero, r0 ← remainder'],
  ['divul', 'DIVUL', 'rd ← r0:rd ÷ src, r0 ← remainder: 64/32, chains through a bignum'],

I('addi', 'ADDI', 'rd, #s8', 'imm:8 rd:4', { src: ['1a'], d: 'rd ← rd + an 8-bit constant; sets N and Z only', cs: '#s8' });
I('cmpi', 'CMPI', 'rd, #s8', 'imm:8 rd:4', { src: ['1a'], d: 'Flags of rd − an 8-bit constant', cs: '#s8' });
I('mvi7', 'MVI', 'rd, #u7', 'rd:4 imm:7', { ...RFC, g: 'mov', d: 'rd ← a constant 0–127, zero-extended; flags untouched. Characters and small counts in one parcel, for half a row', cs: '#u7' });
I('cmpi7', 'CMPI', 'rd, #u7', 'rd:4 imm:7', { ...RFC, d: 'Flags of rd − a constant 0–127: character tests in one parcel, for half a row', cs: '#u7' });
I('ld4', 'LD', 'rd, [rs + 4o]', 'rd:4 rs:4 o:4', { g: 'mov', src: ['1a'], d: 'Word load, offset 0–60, one parcel', cs: '[rs+4o]' });
I('st4', 'ST', 'rd, [rs + 4o]', 'rd:4 rs:4 o:4', { g: 'mov', src: ['1a'], d: 'Word store, offset 0–60, one parcel', cs: '[rs+4o]' });
I('ldb1', 'LDB', 'rd, [rs + o]', 'rd:4 rs:4 o:4', { g: 'mov', src: ['1a'], d: 'Byte load, zero-extended, offset 0–15', cs: '[rs+o]' });
I('stb1', 'STB', 'rd, [rs + o]', 'rd:4 rs:4 o:4', { g: 'mov', src: ['1a'], d: 'Byte store, offset 0–15', cs: '[rs+o]' });

// unary: rd ← f(rs)
[
  ['not', 'NOT', 'rd ← ~rs'], ['neg', 'NEG', 'rd ← 0 − rs; sets NZCV'],
  ['inc', 'INC', 'rd ← rs + 1; sets N and Z only'], ['dec', 'DEC', 'rd ← rs − 1; sets N and Z only'],
  ['rlc', 'RLC', 'rd ← rs rotated left through C'], ['rrc', 'RRC', 'rd ← rs rotated right through C'],
  ['swap', 'SWAP', 'rd ← rs with its 16-bit halves swapped'],
  ['sxb', 'SXB', 'rd ← the low byte of rs, sign-extended'], ['zxb', 'ZXB', 'rd ← the low byte of rs, zero-extended'],
  ['sxh', 'SXH', 'rd ← the low half of rs, sign-extended'], ['zxh', 'ZXH', 'rd ← the low half of rs, zero-extended'],

I('rev', 'REV', 'rd, rs', 'rd:4 rs:4', { ...RFC, g: 'unary', r: 'RFC 0006 §5', d: 'rd ← rs with its bytes reversed: big-endian data, SHA-256' });
I('popc', 'POPC', 'rd, rs', 'rd:4 rs:4', { ...RFC, g: 'unary', r: 'RFC 0006 §5', d: 'rd ← the set bits in rs: scheduler and allocator bitmaps' });
I('ffs', 'FFS', 'rd, rs', 'rd:4 rs:4', { ...RFC, g: 'unary', r: 'RFC 0006 §5', d: 'rd ← the index of rs’s lowest set bit' });

[['lsl', 'LSL', 'shifted left'], ['lsr', 'LSR', 'shifted right, logically'], ['asr', 'ASR', 'shifted right, arithmetically'], ['ror', 'ROR', 'rotated right']].forEach(([id, m, d]) => {

  I(id + '_r', m, 'rd, rs', 'rd:4 rs:4', { g: 'bits', d: `rd ← rd ${d} by rs & 31`, cs: 'rs' });

});

I('fsr', 'FSR', 'rd, rs', 'rd:4 rs:4', { ...RFC, g: 'bits', r: 'RFC 0006 §5', d: 'Funnel shift: rd ← (rd:rs) >> n, the count in HI. A word of a bit-aligned copy 26.5 → 13.5 cycles' });
I('merge', 'MERGE', 'rd, rs, r0', 'rd:4 rs:4', { ...RFC, g: 'bits', r: 'RFC 0006 §5', d: 'rd ← (rd & ~r0) | (rs & r0), the mask in r0: −20% of the glyph loop' });
I('bfx', 'BFX', 'rd, rs, #pos, #len', 'rd:4 rs:4', { ...RFC, g: 'bits', ext: 1, xl: 'pos len', r: 'RFC 0006 §5', d: 'Bit-field extract: protocols, file formats, graphics' });
I('bfi', 'BFI', 'rd, rs, #pos, #len', 'rd:4 rs:4', { ...RFC, g: 'bits', ext: 1, xl: 'pos len', r: 'RFC 0006 §5', d: 'Bit-field insert' });

I('addb4', 'ADD.B4', 'rd, rs', 'rd:4 rs:4', { ...RFC, r: 'RFC 0006 §5', d: 'Packed byte add, the carries gated at byte boundaries: pixels, zero-byte search. 1–2 chips' });
I('add3', 'ADD3', 'rd, rs, rt', 'rd:4 rs:4 rt:4', { ...RFC, r: 'RFC 0006 §4', d: 'Three-operand add, like 1b’s LEA [rA + rB*s] as an ALU operation', cs: 'rs,rt' });
I('xor3', 'XOR3', 'rd, rs, rt', 'rd:4 rs:4 rt:4', { src: ['rfc'], st: 'notrec', r: 'RFC 0006 §6', d: 'Three-operand XOR for Egret’s method-cache hash: under 1%', cs: 'rs,rt' });

I('subh', 'SUB.H', 'rd, ea', 'rd:4', { ...RFC, ea: 'any', r: 'RFC 0006 §5', d: '16-bit subtract (68000 .W). Reopened' });
I('cmph', 'CMP.H', 'rd, ea', 'rd:4', { ...RFC, ea: 'any', r: 'RFC 0006 §5', d: '16-bit compare (68000 .W). Reopened' });
I('mula', 'MULA', 'r0:r1, rd, rs', 'rd:4 rs:4', { ...RFC, g: 'muldiv', r: 'RFC 0006 §5', d: 'Multiply-accumulate into r0:r1: multiply was 50% of mandel; audio, graphics, DSP' });
I('mulfx', 'MULFX', 'r0:rd, rs, #n', 'rd:4 rs:4 n:5', { ...RFC, g: 'muldiv', r: 'RFC 0006 §5', d: 'Fixed-point multiply: multiply, then shift right by n; r0 ← the product’s high half', cs: 'rs,#n' });
I('setcc', 'SETcc', 'rd, cc', 'rd:4 cc:4', { d: 'rd ← 1 if cc holds, else 0; flags unchanged' });

I('bcc', 'Bcc', 'cc, s8', 'off:8 cc:4', { g: 'ctrl', d: 'PC ← PC + 2·s8 if cc holds. cc = E is BRA, cc = F is BSR. 95% of draft 0’s branches fit 6 bits', cs: 's8' });
I('jcc16', 'Jcc', 'cc, rel16', 'cc:4', { g: 'ctrl', ext: 1, xl: 'rel16', d: 'PC ← PC + 2·s16 if cc holds. cc = E is JMP, cc = F is CALL', cs: 'rel16' });
I('jcc32', 'Jcc', 'cc, abs32', 'cc:4', { g: 'ctrl', ext: 2, xl: 'abs32', d: 'PC ← a 32-bit address if cc holds. cc = E is JMP, cc = F is CALL', cs: 'abs32' });
I('jmpea', 'JMP', 'ea', '', { g: 'ctrl', ea: 'value', src: ['1b'], d: 'PC ← the operand’s value: JMP [table + r] is a whole jump table' });
I('callea', 'CALL', 'ea', '', { g: 'ctrl', ea: 'value', src: ['1b'], d: 'Push the return address; PC ← the operand’s value. The Lisp calls through a code word with CALL [r + 1]' });
I('jmpr', 'JMP', 'rs', 'rs:4', { g: 'ctrl', d: 'PC ← rs', cs: 'rs' });
I('callr', 'CALL', 'rs', 'rs:4', { g: 'ctrl', d: 'Push the return address; PC ← rs', cs: 'rs' });
I('ret', 'RET', '', '', { g: 'ctrl', d: 'Pop PC' });
I('dbnz', 'DBNZ', 'r, d7', 'r:4 off:7', { ...RFC, g: 'ctrl', r: 'RFC 0006 §5', d: 'Decrement r, branch if it isn’t zero. 2.3% of draft 0’s instructions; rejected, then reopened', cs: 'r,d7' });
I('dbnz4', 'DBNZ', 'r, back4', 'r:4 off:4', { ...RFC, g: 'ctrl', d: 'Decrement r and branch 1–16 parcels back if it isn’t zero; flags untouched. Over 99% of the hand-written programs’ decrement-and-branch loops fit, and it takes one cell', cs: 'r,back4' });
I('loop', 'LOOP', 'rc, end', 'rc:4 off:8', { ...RFC, g: 'ctrl', r: 'RFC 0006 §5', d: 'Zero-overhead loop (DSP style), about 10 chips for a PC comparator', cs: 'rc,end' });
I('skip', 'SKIPcc', 'cc', 'cc:4', { ...RFC, g: 'ctrl', r: 'RFC 0006 §5', d: 'Skip the next instruction if cc holds (PDP-8 skips, Thumb-2 IT): branch-free min, max and conditional moves' });
I('bl', 'BL', 'rel16', '', { ...RFC, g: 'ctrl', ext: 1, xl: 'rel16', r: 'RFC 0006 §5', d: 'Call that leaves the return address in a register. 0.7% of Egret’s JIT; rejected, then reopened' });
I('cbcc', 'CBcc', 'rd, rs, cc, rel16', 'rd:4 rs:4 cc:4', { g: 'ctrl', src: ['rfc'], st: 'rejected', ext: 1, xl: 'rel16', r: 'RFC 0006 §7', d: 'Compare and branch: two parcels either way, about a cycle saved', cs: 'rd,rs' });
I('bsr12', 'BSR', 's12', 'off:12', { g: 'ctrl', src: ['rfc'], st: 'rejected', r: 'RFC 0006 §7', d: 'A ±4 KB call (SuperH): about 9% less code and no cycles', cs: 's12' });

// system
I('halt', 'HALT', '', '', { g: 'sys', d: 'Stop, or wait for an interrupt. The all-zero parcel is HALT, so zeroed memory stops' });
I('nop', 'NOP', '', '', { g: 'sys', d: 'Nothing. .align should pad code with it' });
I('rti', 'RTI', '', '', { g: 'sys', d: 'Pop the flags, then PC' });
I('ei', 'EI', '', '', { g: 'sys', d: 'I ← 1' });
I('di', 'DI', '', '', { g: 'sys', d: 'I ← 0' });
I('mfsr', 'MFSR', 'rd, n', 'rd:4 n:4', { g: 'sys', d: 'rd ← special register n. Draft 2: ccr (0) for user mode, and the supervisor’s 8–15 (RFC 0029). 1b: flags and HI; v1bs added far, fsr, ctx, mapa, mapd, bank and sysctl', cs: 'rd,n' });
I('mtsr', 'MTSR', 'n, rs', 'n:4 rs:4', { g: 'sys', d: 'Special register n ← rs', cs: 'n,rs' });
I('swi', 'SWI', '#n', 'n:8', { g: 'sys', d: 'Software interrupt. A vectored SWI, each n its own entry, takes a null system call from 39 to about 23 cycles', cs: '#n' });
I('illegal', 'ILLEGAL', '', '', { g: 'sys', d: 'Always traps. 0xFFFF must stay illegal, so erased memory traps' });
I('mfur', 'MFUR', 'rd, rs', 'rd:4 rs:4', { g: 'sys', src: ['v1bs'], st: 'measured', r: 'report 0020', d: 'Supervisor only: rd ← the user’s register rs, from its bank' });
I('mtur', 'MTUR', 'rd, rs', 'rd:4 rs:4', { g: 'sys', src: ['v1bs'], st: 'measured', r: 'report 0020', d: 'Supervisor only: the user’s register rd ← rs' });
I('in', 'IN', 'rd, #port', 'port:8 rd:4', { g: 'sys', src: ['rfc'], st: 'notrec', r: 'RFC 0006 §7', d: 'A separate I/O space. Memory-mapped I/O already works with every addressing mode', cs: '#port' });
I('out', 'OUT', '#port, rs', 'port:8 rs:4', { g: 'sys', src: ['rfc'], st: 'notrec', r: 'RFC 0006 §7', d: 'Output to a separate I/O space', cs: '#port' });

// block and multiple
I('save', 'SAVE', 'ra-rb', 'ra:4 rb:4', { g: 'block', d: 'Push ra…rb. Replaced 14 pushes and pops in draft 0’s programs', cs: 'ra-rb' });
I('restore', 'RESTORE', 'ra-rb', 'ra:4 rb:4', { g: 'block', d: 'Pop ra…rb; flags unchanged', cs: 'ra-rb' });
I('ldm', 'LDM', 'rb, ra-rc', 'rb:4 ra:4 rc:4', { g: 'block', src: ['rfc'], st: 'recommended', r: 'RFC 0006 §5', d: 'Load-multiple through any register, with writeback (68000 MOVEM, ARM LDM): a copied word 9.2 → 5.1 cycles', cs: 'rb,ra-rc' });
I('stm', 'STM', 'rb, ra-rc', 'rb:4 ra:4 rc:4', { g: 'block', src: ['rfc'], st: 'recommended', r: 'RFC 0006 §5', d: 'Store-multiple through any register: zeroing a page −41%', cs: 'rb,ra-rc' });
I('bmove', 'BMOVE', '', '', { ...RFC, g: 'block', r: 'RFC 0006 §5', d: 'Interruptible block move, addresses and count in registers: about 2 bus cycles a halfword' });
I('bfill', 'BFILL', '', '', { ...RFC, g: 'block', r: 'RFC 0006 §5', d: 'Interruptible block fill' });
I('bcmp', 'BCMP', '', '', { ...RFC, g: 'block', r: 'RFC 0006 §5', d: 'Interruptible block compare' });

I('outblk', 'OUTBLK', '', '', { ...RFC, g: 'block', r: 'RFC 0009', d: 'Block output to a device' });

I('decm', 'DEC', 'ea', '', { ...RFC, ea: 'mem', wr: true, r: 'RFC 0006 §3.2', d: 'Memory decrement' });
I('addm', 'ADD', 'ea, rs', 'rs:4', { src: ['rfc'], st: 'notrec', ea: 'mem', wr: true, r: 'RFC 0006 §7', d: 'Memory-destination ALU operations: 0.4% of draft 0’s instructions, all in fib' });
I('xchg', 'XCHG', 'rs, ea', 'rs:4', { ...RFC, g: 'mov', ea: 'mem', wr: true, r: 'RFC 0006 §5', d: 'Atomic exchange, with LOCK on the bus' });

I('tsub', 'TSUB', 'rd, rs', 'rd:4 rs:4', { g: 'tag', src: ['v1bx', 'rfc'], st: 'measured', r: 'RFC 0006 §6', d: 'Subtract; traps unless both are integers, or on overflow' });
I('tcmp', 'TCMP', 'rd, rs', 'rd:4 rs:4', { g: 'tag', src: ['v1bx', 'rfc'], st: 'measured', r: 'RFC 0006 §6', d: 'Compare; traps unless both are integers' });
I('tmov', 'TMOV', 'rd, rs', 'rd:4 rs:4', { g: 'tag', src: ['v1bx'], st: 'measured', r: 'report 0018', d: 'Move; traps unless rs is an integer (v1bx’s MOV.T)' });
I('ttst', 'TTST', 'rd, rs', 'rd:4 rs:4', { ...RFC, g: 'tag', r: 'report 0017', d: 'Z unless both are integers: 2.7% of Egret’s JIT runs' });
I('ldclass', 'LDCLASS', 'rd, rs', 'rd:4 rs:4', { g: 'tag', src: ['rfc'], st: 'notrec', r: 'RFC 0006 §6', d: 'Load a value’s class, for Egret’s inline caches: about 1%' });
I('chk', 'CHK', 'rd, ea', 'rd:4', { g: 'tag', src: ['rfc'], st: 'notrec', ea: 'any', r: 'RFC 0006 §6', d: 'Compare with a bound and trap (68000 CHK): under 1%' });

const CAT = new Map(C.map(x => [x.id, x]));

/* ------------------------------------------------------------------ */
/* Addressing modes. A sized memory mode is kind.size                  */
/* ------------------------------------------------------------------ */
const MD = [];
const Md = (id, syn, short, f, cls, o = {}) => MD.push({ id, kind: id, syn, short, f, cls, ext: 0, xl: '', src: [], d: '', ...o });
Md('r', 'rs', 'rs', 'R:4', 'reg', { src: D1, d: 'A register' });
Md('rt', 'rs.T', 'rs.T', 'R:4', 'reg', { src: ['v1bx'], d: 'A register, trapping unless both operands are integers: v1bx’s mode E, −6.4% of the Lisp’s compiled cycles' });
Md('q', '#q', '#q', 'q:4', 'const', { src: ['1b'], d: 'A constant 0…15 in the instruction' });
Md('nq', '#−q', '#−q', 'q:4', 'const', { src: ['1b'], d: 'A constant −1…−16 in the instruction' });
Md('q5', '#s5', '#s5', 'q:5', 'const', { d: 'A constant −16…15: 1b’s two quick-constant modes as one, two cells wide' });
Md('i8', '#s8', '#s8', 'imm:8', 'const', { d: 'An 8-bit constant in the first parcel. With a register, that’s 12 bits: a row of cells. Characters and masks would fit' });
Md('i16', '#s16', '#s16', '', 'const', { ext: 1, xl: 's16', src: D1, d: 'A signed 16-bit constant' });
Md('u16', '#u16', '#u16', '', 'const', { ext: 1, xl: 'u16', src: D1, d: 'An unsigned 16-bit constant' });
Md('h16', '#hi16', '#hi16', '', 'const', { ext: 1, xl: 'hi16', src: D1, d: 'A 16-bit constant shifted left 16' });
Md('i32', '#imm32', '#32', '', 'const', { ext: 2, xl: 'imm32', src: D1, d: 'A 32-bit constant' });
Md('spc', 'special', 'spec', 'R:4', 'spec', { ext: [1, 2], xl: '1–2 parcels', src: ['1b'], d: '1b’s mode F: R picks a 16- or 32-bit constant, or an absolute or PC-relative word, byte or half' });
Md('idx', '[R + Rx·s + d8]', '[R+X·s]', 'R:4', 'mem', { ext: 1, xl: 'x s z d8', src: ['1b'], d: 'Indexed: index register, scale ×1–8, size and an 8-bit displacement in the extension parcel. The d8 can’t hold a table address' });
Md('sp', '[sp + 4R]', '[sp+4R]', 'R:4', 'mem', { src: ['1b'], d: 'A stack slot, 0–60 (R is the offset). 0.0% of hand-written operands, 0.1% of compiled ones' });
const SZ = [
  ['w', '', '', 'word', 'a word'],
  ['b', 'byte ', 'b', 'byte', 'a byte, zero-extended when read'],
  ['h', 'half ', 'h', 'half', 'a half, zero-extended when read'],
  ['sb', 'sbyte ', 'sb', 'sbyte', 'a byte, sign-extended'],
  ['sh', 'shalf ', 'sh', 'shalf', 'a half, sign-extended'],
];
const MK = [
  ['ind', '[R]', '[R]', 'R:4', 0, '', 'At R'],
  ['d16', '[R + d16]', '[R+d16]', 'R:4', 1, 'd16', 'At R plus a 16-bit displacement'],
  ['d32', '[R + d32]', '[R+d32]', 'R:4', 2, 'd32', 'At R plus a 32-bit displacement. 1b’s [label + reg] reaches only ±32 KB'],
  ['k', null, null, 'R:4 k:4', 0, '', 'At R plus a 4-bit offset scaled by the size: struct fields in one parcel, for a row of cells'],
  ['inc', '[R]+', '[R]+', 'R:4', 0, '', 'At R, then R steps on by the size', true],
  ['dec', '-[R]', '-[R]', 'R:4', 0, '', 'R steps back by the size, then at R', true],
  ['a16', '[abs16]', '[a16]', '', 1, 'abs16', 'At a sign-extended 16-bit address; the I/O page is at the top'],
  ['a32', '[abs32]', '[a32]', '', 2, 'abs32', 'At a 32-bit address'],
  ['pc', '[pc + d16]', '[pc+d]', '', 1, 'd16', 'At PC plus a 16-bit displacement'],

const KSYN = { w: '[R + 4k]', b: '[R + k]', sb: '[R + k]', h: '[R + 2k]', sh: '[R + 2k]' };

const IN1B = new Set('ind.w d16.w inc.w dec.w ind.b d16.b inc.b ind.h d16.h a16.w a16.b a16.h a32.w a32.b a32.h pc.w pc.b pc.h'.split(' '));
const IN1A = new Set('d16.w d16.b d16.h d16.sb d16.sh d32.w d32.b k.w k.b'.split(' '));
const SIZED = new Set(MK.map(k => k[0]));
for (const [k, syn, short, f, ext, xl, d, wb] of MK) for (const [s, kw, pre, , sd] of SZ) {
  const id = k + '.' + s;
  MD.push({
    id, kind: k, sz: s, syn: kw + (syn || KSYN[s]), short: pre + (short || KSHORT[s]), f, cls: 'mem', ext, xl, wb: !!wb,
    src: [...(IN1A.has(id) ? ['1a'] : []), ...(IN1B.has(id) ? ['1b'] : [])], d: `${d}: ${sd}`,

}
const MCAT = new Map(MD.map(m => [m.id, m]));

const PRESETS = [
  { id: 's1b', name: '1b’s 16 modes', slots: ['r', 'q', 'ind.w', 'd16.w', 'sp', 'idx', 'inc.w', 'dec.w', 'ind.b', 'd16.b', 'inc.b', 'ind.h', 'd16.h', 'nq', null, 'spc'] },
  { id: 'smem', name: 'Word memory', slots: ['ind.w', 'd16.w', 'inc.w', 'dec.w', 'idx', 'a16.w', 'pc.w', 'a32.w'] },
  { id: 'sbh', name: 'Byte and half memory', slots: ['ind.b', 'd16.b', 'inc.b', 'dec.b', 'ind.sb', 'd16.sb', 'inc.sb', 'dec.sb', 'ind.h', 'd16.h', 'inc.h', 'dec.h', 'ind.sh', 'd16.sh', 'inc.sh', 'dec.sh'] },
  { id: 'sconst', name: 'Constants', slots: ['q', 'nq', 'i16', 'u16', 'h16', 'i32'] },
  { id: 'salu8', name: 'Eight for ALU ops (a sketch)', slots: ['r', 'q', 'nq', 'ind.w', 'd16.w', 'inc.w', 'd16.b', 'spc'] },

const pad16 = a => Array.from({ length: 16 }, (_, i) => a[i] || null);

/* ------------------------------------------------------------------ */
/* State, history and storage                                          */
/* ------------------------------------------------------------------ */
const S = {
  ready: false, saved: true,
  maps: [], mapId: null, mapName: '', created: 0,
  st: null, log: [], cur: 0,
  pending: null, modal: null, toast: null,
  ui: {
    grid: 'root', focus: null, wantFocus: false, over: null, tab: 'instr',
    q: '', srcOff: {}, hideRej: false, unplaced: false, openIns: null,
    rp: { i: null, set: 's1b', start: 0, skip: true, rep: false },
    setSel: 's1b', def: null, renaming: null, delMap: false,
    exp: { kind: 'json', hist: true }, imp: '', impErr: '',
  },

let R = () => {};
const presetSets = () => Object.fromEntries(PRESETS.map(s => [s.id, { name: s.name, slots: pad16(s.slots) }]));
const emptyState = () => ({ cells: {}, grids: {}, instrs: {}, modes: {}, sets: presetSets(), settings: { opLow: true } });
const migrate = st => {

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ck = (g, b) => g + '/' + hex2(b);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }

function applyOne(st, c, k, v) {
  const coll = { ...st[c] };
  if (v === null || v === undefined) delete coll[k]; else coll[k] = v;
  return { ...st, [c]: coll };
}
function applyPatch(st, patch, dir) {
  if (dir > 0) for (const e of patch) st = applyOne(st, e.c, e.k, e.a);
  else for (let i = patch.length - 1; i >= 0; i--) st = applyOne(st, patch[i].c, patch[i].k, patch[i].b);
  return st;
}

// IndexedDB: one record per map (its current state and history position), one per history step
const store = {
  db: null,
  mem: { maps: new Map(), logs: new Map() },
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('heron-opcode-map', 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          if (!d.objectStoreNames.contains('maps')) d.createObjectStore('maps', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('log')) d.createObjectStore('log', { keyPath: ['map', 'seq'] });
        };
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  req(rq) { return new Promise(res => { rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); }); },
  async maps() {
    if (!this.db) return [...this.mem.maps.values()];
    try { return (await this.req(this.db.transaction('maps').objectStore('maps').getAll())) || []; } catch (e) { return []; }
  },
  async getMap(id) {
    if (!this.db) return this.mem.maps.get(id) || null;
    try { return await this.req(this.db.transaction('maps').objectStore('maps').get(id)); } catch (e) { return null; }
  },
  async log(id) {
    if (!this.db) return (this.mem.logs.get(id) || []).slice();
    try { return (await this.req(this.db.transaction('log').objectStore('log').getAll(IDBKeyRange.bound([id, 0], [id, Infinity])))) || []; } catch (e) { return []; }
  },
  write({ map = null, puts = [], cut = null, drop = null }) {
    if (!this.db) {
      if (cut) this.mem.logs.set(cut.map, (this.mem.logs.get(cut.map) || []).filter(x => x.seq < cut.seq));
      for (const e of puts) this.mem.logs.set(e.map, [...(this.mem.logs.get(e.map) || []), e]);
      if (map) this.mem.maps.set(map.id, map);
      if (drop) { this.mem.maps.delete(drop); this.mem.logs.delete(drop); }
      return;
    }
    try {
      const t = this.db.transaction(['maps', 'log'], 'readwrite');
      const ms = t.objectStore('maps'), ls = t.objectStore('log');
      if (cut) ls.delete(IDBKeyRange.bound([cut.map, cut.seq], [cut.map, Infinity]));
      for (const e of puts) ls.put(e);
      if (map) ms.put(map);
      if (drop) { ms.delete(drop); ls.delete(IDBKeyRange.bound([drop, 0], [drop, Infinity])); }
      t.onabort = lost; t.onerror = lost;
    } catch (e) { lost(); }
  },
  record() { return { id: S.mapId, name: S.mapName, created: S.created, updated: Date.now(), st: S.st, cur: S.cur }; },
  commit(e) { this.write({ cut: { map: S.mapId, seq: e.seq }, puts: [e], map: this.record() }); touchMap(); },
  saveMap() { this.write({ map: this.record() }); touchMap(); },
};
function lost() { if (S.saved) { S.saved = false; flash('Saving failed: this browser refused to store the map. Export it to keep it.'); } }
function touchMap() { const m = S.maps.find(x => x.id === S.mapId); if (m) { m.name = S.mapName; m.updated = Date.now(); } }

function commit(label, changes) {
  let st = S.st;
  const patch = [];
  for (const ch of changes) {
    const b = st[ch.c][ch.k] ?? null, a = ch.v ?? null;
    if (same(a, b)) continue;
    patch.push({ c: ch.c, k: ch.k, b, a });
    st = applyOne(st, ch.c, ch.k, a);
  }
  if (!patch.length) return false;
  S.st = st;
  S.log = S.log.slice(0, S.cur);
  const e = { map: S.mapId, seq: S.cur, label, time: Date.now(), patch };
  S.log.push(e);
  S.cur++;
  store.commit(e);
  afterChange();
  return true;
}
function afterChange() {
  if (!GI()[S.ui.grid]) { S.ui.grid = 'root'; S.ui.focus = null; }
  R();
}
function undo() {
  if (!S.cur) return;
  const e = S.log[S.cur - 1];
  S.st = applyPatch(S.st, e.patch, -1); S.cur--; S.pending = null;
  store.saveMap(); flash('Undid: ' + e.label); afterChange();
}
function redo() {
  if (S.cur >= S.log.length) return;
  const e = S.log[S.cur];
  S.st = applyPatch(S.st, e.patch, 1); S.cur++; S.pending = null;
  store.saveMap(); flash('Redid: ' + e.label); afterChange();
}
function jumpTo(n) {
  while (S.cur > n) { S.st = applyPatch(S.st, S.log[S.cur - 1].patch, -1); S.cur--; }
  while (S.cur < n) { S.st = applyPatch(S.st, S.log[S.cur].patch, 1); S.cur++; }
  S.pending = null; store.saveMap(); afterChange();
}

let toastTimer = 0;
function flash(msg) {
  S.toast = msg; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; R(); }, 2800);
  R();
}

/* maps */
async function openMap(id) {
  const rec = await store.getMap(id);
  if (!rec) return;
  S.mapId = rec.id; S.mapName = rec.name; S.created = rec.created || Date.now();
  S.st = migrate(rec.st);
  S.log = (await store.log(id)).sort((a, b) => a.seq - b.seq);
  S.cur = Math.min(rec.cur || 0, S.log.length);
  S.ui.grid = 'root'; S.ui.focus = null; S.ui.def = null; S.ui.renaming = null; S.ui.delMap = false; S.pending = null;
  lsSet('heron-opcode-map:current', id);
  R();
}
async function newMap(name, st, log = [], cur = 0) {
  const id = uid('m');
  const rec = { id, name, created: Date.now(), updated: Date.now(), st: st || emptyState(), cur };
  store.write({ map: rec, puts: log.map((e, i) => ({ map: id, seq: i, label: e.label, time: e.time, patch: e.patch })) });
  S.maps.push({ id, name, updated: rec.updated });
  await openMap(id);
}
const nextMapName = () => { let n = S.maps.length + 1; while (S.maps.some(m => m.name === 'Map ' + n)) n++; return 'Map ' + n; };
async function dupMap() { await newMap(S.mapName + ' copy', S.st, S.log, S.cur); flash('Duplicated, with its history'); }
async function delMap() {
  const id = S.mapId;
  store.write({ drop: id });
  S.maps = S.maps.filter(m => m.id !== id);
  if (!S.maps.length) await newMap('Draft 2'); else await openMap(S.maps[0].id);
  flash('Map deleted');
}
function finishRename() {
  const u = S.ui;
  if (u.renaming === null) return;
  const n = u.renaming.trim();
  u.renaming = null;
  if (n && n !== S.mapName) { S.mapName = n; store.saveMap(); }
  R();
}

// The map the page was built with (heron opcode_map build, and the
// website): RFC 0028's, named after the commit that last changed it. A
// first visit opens it; a later one opens it as a map of its own when it
// has changed since, and leaves the visitor's maps as they were.
const BUNDLED = (() => {
  try { const b = JSON.parse(document.getElementById('heron-map').textContent); return b && b.map && b.map.state ? b : null; }
  catch (e) { return null; }
})();
async function openBundled() { await newMap(BUNDLED.name, migrate(BUNDLED.map.state)); }

async function boot() {
  S.saved = await store.open();
  let maps = await store.maps();
  const changed = !!BUNDLED && lsGet('heron-opcode-map:bundled') !== BUNDLED.stamp;
  if (!maps.length) {
    const rec = { id: uid('m'), name: BUNDLED ? BUNDLED.name : 'Draft 2', created: Date.now(), updated: Date.now(),
      st: BUNDLED ? migrate(BUNDLED.map.state) : emptyState(), cur: 0 };
    store.write({ map: rec });
    maps = [rec];
  }
  maps.sort((a, b) => (a.created || 0) - (b.created || 0));
  S.maps = maps.map(m => ({ id: m.id, name: m.name, updated: m.updated }));
  const want = lsGet('heron-opcode-map:current');
  await openMap(maps.some(m => m.id === want) ? want : maps[maps.length - 1].id);
  const fresh = changed && !S.maps.some(m => m.name === BUNDLED.name);
  if (fresh) await openBundled();
  if (BUNDLED) lsSet('heron-opcode-map:bundled', BUNDLED.stamp);
  S.ready = true;
  R();
  if (fresh) flash(`${BUNDLED.name} is new, so it opened as a map of its own; yours are as you left them`);
}

/* ------------------------------------------------------------------ */
/* Lookups and encoding                                                */
/* ------------------------------------------------------------------ */
function ins(id) {
  return S.st.instrs[id] || CAT.get(id) || { id, m: '?' + id, syn: '', f: '', ea: null, ext: 0, g: 'sys', src: [], st: 'open', d: 'An instruction this map no longer knows', missing: true };
}
// A mode table: the mode number and its register fill the register byte, the modes coming from a mode set (1b's M field)
const TABLE_FITS = m => !!m && m.cls !== 'table' && fbits(parseF(m.f)) <= 4;
const defaultTable = () => S.st.sets.s1b ? 's1b' : (Object.keys(S.st.sets)[0] || 's1b');
function tableMode(id) {
  const sid = id.slice(3), set = S.st.sets[sid];
  const base = { id, kind: 'ea', table: sid, syn: 'ea', short: 'ea', f: 'M:4 R:4', cls: 'table', first: true, xl: 'the mode’s data', src: ['1b'] };
  if (!set) return { ...base, ext: 0, d: 'A mode table that no longer exists', missing: true };
  let lo = Infinity, hi = 0;
  for (const mid of set.slots) {
    if (!mid || mid.startsWith('ea:')) continue;
    const m = mode(mid);
    if (!TABLE_FITS(m)) continue;
    const [a, b] = extRange(m.ext);
    lo = Math.min(lo, a); hi = Math.max(hi, b);
  }
  return { ...base, ext: [lo === Infinity ? 0 : lo, hi], d: `Any mode from the table “${set.name}”: the mode number and its register fill the register byte, so a one-operand instruction takes every mode in one cell. 1b’s main format and its op B work this way` };
}
function mode(id) {
  if (!id) return null;
  if (id.startsWith('ea:')) return tableMode(id);
  return S.st.modes[id] || MCAT.get(id) || { id, kind: id, syn: '?' + id, short: '?', f: '', cls: 'mem', ext: 0, src: [], d: 'A mode this map no longer knows', missing: true };
}
function allIns() {
  const o = S.st.instrs;
  const out = C.map(x => o[x.id] || x);
  for (const id in o) if (!CAT.has(id)) out.push(o[id]);
  return out;
}
const allModes = () => [...MD, ...Object.values(S.st.modes)];
const parseF = s => (s || '').trim().split(/\s+/).filter(Boolean).map(t => { const [n, b] = t.split(':'); return { n, b: parseInt(b, 10) || 0 }; });
const fbits = fs => fs.reduce((a, f) => a + f.b, 0);
const extRange = e => Array.isArray(e) ? e : [e || 0, e || 0];
const synWithMode = (I, M) => (I.syn || '').replace(/\bea\b/, M ? M.syn : 'ea');

  if (p.x) return 'an extension grid';

}
const lenText = ([a, b]) => a === b ? `${a} parcel${a > 1 ? 's' : ''}` : `${a}–${b} parcels`;

function legal(I, M) {
  if (!I) return null;
  if (!I.ea) return M ? `${I.m} takes no addressing mode` : null;
  if (!M) return 'it needs an addressing mode';
  if (M.missing) return 'the mode is unknown';
  if (M.cls === 'table') {
    const ok = (S.st.sets[M.table]?.slots || []).some(mid => mid && !mid.startsWith('ea:') && TABLE_FITS(mode(mid)) && !legal(I, mode(mid)));
    return ok ? null : `none of the table’s modes suit ${I.m}`;
  }
  const mem = M.cls === 'mem' || M.cls === 'spec';
  if (I.ea === 'mem') {
    if (!mem) return `${I.m} needs a memory operand`;
    if (I.wr && (M.sz === 'sb' || M.sz === 'sh')) return 'a store has no signed size';
  }
  if (I.ea === 'addr') {
    if (!mem) return `${I.m} needs an address`;
    if (M.wb) return 'an auto-increment mode has no single address';
    if (M.sz && M.sz !== 'w' && M.kind !== 'k') return 'the size makes no difference to an address';
  }
  return null;

// Where the operand bits go: the register byte first, then low opcode bits (a block of cells),
// or an extension parcel. In an extension grid every operand goes in extension parcels.
function layout(p, depth) {
  if (p.x) return { span: 1, B: 0, fields: [], len: [1, 1], over: 0, unused: 0 };
  const In = ins(p.i), M = mode(p.m);
  const fields = M && M.first ? [...parseF(M.f), ...parseF(In.f)] : [...parseF(In.f), ...(M ? parseF(M.f) : [])];
  const B = fbits(fields);
  const me = extRange(M ? M.ext : 0), ie = extRange(In.ext);
  let span = 1, first = 1, over = 0;
  if (depth === 0) {
    if (B > 8) {
      if (p.ov === 'ext' || B > 16) { over = B - 8; first = 1 + Math.ceil(over / 16); }
      else span = 1 << (B - 8);
    }
  } else first = Math.ceil((8 * (depth + 1) + B) / 16);
  return { span, B, fields, over, first, len: [first + me[0] + ie[0], first + me[1] + ie[1]], unused: depth === 0 && B < 8 ? 8 - B : 0 };
}

function encoding(p, base, depth, path) {
  const L = layout(p, depth);
  const opLow = S.st.settings.opLow !== false;
  const opPos = opLow ? 8 : 0, regPos = opLow ? 0 : 8; // bit index 0 is bit 15
  const parcels = [], free = [];
  const newP = () => { const a = Array.from({ length: 16 }, () => ({ t: 'u' })); parcels.push(a); return a; };

    const P = newP();
    setByte(P, opPos, base);
    const e = Math.log2(L.span);
    for (let i = 0; i < 8; i++) free.push([P, regPos + i]);
    for (let i = 8 - e; i < 8; i++) { P[opPos + i] = { t: 'u' }; free.push([P, opPos + i]); }
  } else {
    const ops = [...path, base];
    let P = null;
    ops.forEach((v, k) => { if (k % 2 === 0) P = newP(); setByte(P, k % 2 === 0 ? opPos : regPos, v); });

  if (S.modal) { if (e.key === 'Escape') { S.modal = null; R(); } return; }
  const f = S.ui.focus, g = S.ui.grid;
  if (e.key === 'Escape') { S.ui.focus = null; S.pending = null; S.ui.def = null; R(); return; }
  const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -16, ArrowDown: 16 }[e.key];
  if (d !== undefined) {
    e.preventDefault();
    if (f && f.type === 'row') { if (Math.abs(d) === 16) selectRow(Math.min(15, Math.max(0, f.row + d / 16))); return; }
    if (!f) { selectCell(0); return; }
    const cur = coverOf(S.st, g, f.byte);
    const rowOf = x => x >> 4;
    let nb = f.byte + d;
    const offRow = x => Math.abs(d) === 1 && rowOf(x) !== rowOf(f.byte);
    if (offRow(nb)) return;
    while (cur && nb >= 0 && nb < 256) {
      const c2 = coverOf(S.st, g, nb);
      if (!c2 || c2.base !== cur.base) break;
      nb += d;
      if (offRow(nb)) return;
    }
    if (nb < 0 || nb > 255) return;
    selectCell(nb);
    return;
  }
  if (!f || f.type !== 'cell') return;
  if (e.key === 'Enter') { e.preventDefault(); S.ui.wantFocus = true; R(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); clearCell(g, f.byte); }
}

/* Components                                                          */

function Chips({ In, compact }) {
  const src = compact && In.src.length === 2 && In.src[0] === '1a' && In.src[1] === '1b' ? ['draft 1'] : In.src.map(s => SRCL[s] || s);
  return html`${src.map(s => html`<span class="chip">${s}</span>`)}${In.st !== 'adopted' && In.st !== 'custom' ? html`<span class=${'chip st-' + In.st}>${STL[In.st] || In.st}</span>` : ''}`;
}
