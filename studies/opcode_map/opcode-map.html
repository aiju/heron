function GridPane() {
  const g = S.ui.grid, gi = GI();
  return html`
    <nav class="gtabs" aria-label="Grids">
      ${gridOrder().map(id => html`<button class=${id === g ? 'on' : ''} onClick=${() => openGrid(id)}>${gridLabel(id)}<small>${usedCells(id)}/256</small></button>`)}
    </nav>
    <p class="hint">${g === 'root'
      ? 'Rows are the opcode byte’s high nibble, columns its low nibble. '
      : `The second byte of ${gi[g].path.map(hex2).join(' ')} xx picks the opcode; operands go in extension parcels. `}Click a cell to write in an instruction, click a row label to fill the row with addressing modes, and drag cells or row labels to move them.</p>
    <div class="gwrap"><${Grid}/></div>
    <${Summary}/>`;
}

function Grid() {
  const st = S.st, g = S.ui.grid, f = S.ui.focus, over = S.ui.over;
  const selBase = f && f.type === 'cell' ? (coverOf(st, g, f.byte)?.base ?? f.byte) : null;
  const selRow = f && f.type === 'row' ? f.row : null;
  const bad = badKeys();
  const depth = depthOf(g);
  const out = [html`<div class="corner" style="grid-row:1;grid-column:1"></div>`];
  for (let c = 0; c < 16; c++) out.push(html`<div class="colh" style=${`grid-row:1;grid-column:${c + 2}`}>_${HEX[c]}</div>`);
  const covered = new Uint8Array(256);
  for (let r = 0; r < 16; r++) {
    out.push(html`<button class=${'rowh' + (selRow === r ? ' on' : '') + (over === 'r' + r ? ' drop' : '')}
      style=${`grid-row:${r + 2};grid-column:1`} draggable="true" title=${`Row ${HEX[r]}_: fill it with addressing modes`}
      onClick=${() => selectRow(r)} onDragStart=${e => dragStart(e, 'row:' + r)} onDragOver=${e => dragOver(e, 'r' + r)}
      onDrop=${e => drop(e, { row: r })} onDragEnd=${dragEnd}>${HEX[r]}_</button>`);
    for (let c = 0; c < 16; c++) {
      const b = r * 16 + c;
      if (covered[b]) continue;
      const cov = coverOf(st, g, b);
      if (!cov) {
        out.push(html`<div role="gridcell" class=${'cell empty' + (selBase === b ? ' sel' : '') + (over === b ? ' drop' : '')}
          style=${`grid-row:${r + 2};grid-column:${c + 2}`} title=${addrText(g, b) + ': empty'}
          onClick=${() => selectCell(b, true)} onDragOver=${e => dragOver(e, b)} onDrop=${e => drop(e, { byte: b })}>
          <span class="code">${hex2(b)}</span></div>`);
        continue;
      }
      const { base, p, s } = cov;
      for (let i = 0; i < s; i++) covered[base + i] = 1;
      const style = s <= 16
        ? `grid-row:${r + 2};grid-column:${c + 2} / span ${s}`
        : `grid-row:${r + 2} / span ${s / 16};grid-column:2 / span 16`;
      const range = s > 1 ? `${hex2(base)}–${hex2(base + s - 1)}` : hex2(base);
      const common = {
        role: 'gridcell', style, draggable: 'true',
        onClick: () => selectCell(base), onDragStart: e => dragStart(e, 'cell:' + base),
        onDragOver: e => dragOver(e, base), onDrop: e => drop(e, { byte: base }), onDragEnd: dragEnd,
      };
      if (p.x) {
        const name = st.grids[p.g]?.name;
        out.push(html`<div ...${common} class=${'cell ext' + (selBase === base ? ' sel' : '') + (over === base ? ' drop' : '')}
          title=${`${addrText(g, base)}: extension grid${name ? ' ' + name : ''}. Double-click to open`} onDblClick=${() => openGrid(p.g)}>
          <span class="code">${range}</span><span class="mn">EXT</span><span class="md">${name || usedCells(p.g) + ' used'}</span></div>`);
        continue;
      }
      const In = ins(p.i), M = mode(p.m), L = layout(p, depth);
      const sub = M ? M.short : (In.cs || '');
      const lenT = L.len[1] > 1 ? '+' + (L.len[0] === L.len[1] ? L.len[0] - 1 : `${L.len[0] - 1}–${L.len[1] - 1}`) : '';
      out.push(html`<div ...${common}
        class=${'cell g-' + In.g + (s > 1 ? ' wide' : '') + (selBase === base ? ' sel' : '') + (bad.has(ck(g, base)) ? ' bad' : '') + (over === base ? ' drop' : '')}
        title=${`${addrText(g, base, s)}: ${placeLabel(p)} · ${lenText(L.len)}${p.n ? '\n' + p.n : ''}`}>
        <span class="code">${range}</span>
        ${lenT && html`<span class="len">${lenT}</span>`}
        <span class="mn">${In.m}${s > 1 ? html` <span class="syn">${synWithMode(In, M)}</span>` : ''}</span>
        ${s === 1 && sub ? html`<span class="md">${sub}</span>` : ''}
      </div>`);
    }
  }
  return html`<div class="grid" role="grid" aria-label=${'Opcode map, ' + gridLabel(g)}>${out}</div>`;
}

function Summary() {
  const st = S.st, g = S.ui.grid, pre = g + '/';
  const byG = {};
  let used = 0, ext = 0;
  for (const k in st.cells) {
    if (!k.startsWith(pre)) continue;
    const p = st.cells[k], s = p.s || 1;
    used += s;
    if (p.x) { ext++; continue; }
    const gg = ins(p.i).g;
    byG[gg] = (byG[gg] || 0) + s;
  }
  return html`<div class="sum">
    <div class="row gap" style="justify-content:space-between">
      <span class="lbl">${gridLabel(g)}</span>
      <span class="facts">${used} of 256 cells used · ${256 - used} free${ext ? ` · ${ext} extension grid${ext > 1 ? 's' : ''}` : ''} · “+1” marks an extension parcel</span>
    </div>
    <div class="bar" aria-hidden="true">
      ${GROUPS.filter(([id]) => byG[id]).map(([id]) => html`<i class=${'g-' + id} style=${`width:${byG[id] / 2.56}%`}></i>`)}
      ${ext ? html`<i style=${`width:${ext / 2.56}%`}></i>` : ''}
    </div>
    <div class="legend">${GROUPS.map(([id, name]) => html`<span><i class=${'sw g-' + id}></i>${name}${byG[id] ? html` <b>${byG[id]}</b>` : ''}</span>`)}</div>
    <${Checks}/>
  </div>`;
}

function Checks() {
  const list = checks();
  if (!list.length) return html`<p class="facts">No problems found.</p>`;
  const LV = { bad: 'Error', warn: 'Warn', info: 'Note' };
  return html`<div>
    <div class="lbl" style="margin-top:6px">Checks</div>
    <ul class="checks">${list.slice(0, 60).map(x => html`<li onClick=${() => { S.ui.grid = x.g; S.ui.focus = { type: 'cell', byte: x.b }; S.pending = null; S.ui.def = null; R(); }}>
      <span class=${'lvl ' + x.lvl}>${LV[x.lvl]}</span><span class="where">${x.where}</span><span>${x.msg}</span></li>`)}</ul>
    ${list.length > 60 ? html`<p class="facts">…and ${list.length - 60} more.</p>` : ''}
  </div>`;
}

function cellsAt(g, In, text) {
  const pl = { i: In.id };
  if (In.ea) pl.m = parseMode(In, text) || defaultMode(In);
  return layout(pl, depthOf(g)).span;
}

function WriteIn({ onPick, onNew, onPickExt, cellsFor, placeholder, id }) {
  const [t, setT] = useState('');
  const [hi, setHi] = useState(0);
  const ref = useRef(null);
  useEffect(() => { if (S.ui.wantFocus && ref.current) { S.ui.wantFocus = false; ref.current.focus(); } });
  const sug = t.trim() ? suggest(t) : [];
  const mn = (t.trim().split(/\s+/)[0] || '').toUpperCase();
  const showNew = !!onNew && !!mn && !sug.some(x => x.m.toUpperCase() === mn);
  const n = sug.length + (showNew ? 1 : 0);
  const choose = i => {
    if (i < sug.length) { const text = t; setT(''); setHi(0); onPick(sug[i], text); }
    else if (showNew) onNew(mn);
  };
  const chooseExt = i => { if (i < sug.length && onPickExt) { const text = t; setT(''); setHi(0); onPickExt(sug[i], text); } };
  const spans = sug.map(x => cellsFor ? cellsFor(x, t) : 1);
  const key = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setHi(Math.min(hi + 1, Math.max(0, n - 1))); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHi(Math.max(hi - 1, 0)); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (!n) return;
      const i = Math.min(hi, n - 1);
      if (e.shiftKey && onPickExt && i < sug.length) chooseExt(i); else choose(i);
    }
    else if (e.key === 'Escape') { if (t) setT(''); else e.target.blur(); }
  };
  return html`<div class="wi">
    <input ref=${ref} id=${id} class="inp mono" placeholder=${placeholder} value=${t} autocomplete="off" spellcheck=${false}
      aria-label="Instruction" onInput=${e => { setT(e.target.value); setHi(0); }} onKeyDown=${key}/>
    ${t.trim() ? html`<ul class="sug" role="listbox">
      ${sug.map((x, i) => {
        const pm = x.ea ? parseMode(x, t) : null;
        return html`<li role="option" aria-selected=${i === hi} class=${i === hi ? 'on' : ''} onMouseDown=${e => { e.preventDefault(); choose(i); }}>
          <i class=${'sw g-' + x.g}></i><b>${x.m}</b><span class="syn">${pm ? synWithMode(x, mode(pm)) : x.syn}</span>
          <span class="srcs">${x.src.map(s => SRCL[s] || s).join(' ')}${x.st !== 'adopted' && x.st !== 'custom' ? ' · ' + STL[x.st] : ''}</span>
          ${spans[i] > 1 ? html`<span class="cells">${spans[i]} cells</span>` : ''}
          ${spans[i] > 1 && onPickExt ? html`<button class="btn small xb" title="Shift+Enter" onMouseDown=${e => { e.preventDefault(); e.stopPropagation(); chooseExt(i); }}>1 cell + ext</button>` : ''}</li>`;
      })}
      ${showNew ? html`<li role="option" class=${hi === sug.length ? 'on' : ''} onMouseDown=${e => { e.preventDefault(); choose(sug.length); }}>New instruction <b>${mn}</b>…</li>` : ''}
      ${!n ? html`<li class="none">No instruction matches</li>` : ''}
    </ul>` : ''}
    ${onPickExt && spans.some(s => s > 1) ? html`<p class="facts" style="margin:6px 0 0">Shift+Enter, or “1 cell + ext”, keeps a wide one to this cell, with its extra operand bits in an extension parcel.</p>` : ''}
  </div>`;
}

function ModePicker({ value, In, onChange, allowEmpty, noTable, id }) {
  const cur = value ? mode(value) : null;
  const kind = cur ? cur.kind : '';
  const sz = cur && cur.sz ? cur.sz : 'w';
  const okId = mid => !legal(In, mode(mid));
  const okKind = k => k === 'ea' ? okId('ea:' + defaultTable()) : SIZED.has(k) ? SZ.some(([s]) => okId(k + '.' + s)) : okId(k);
  const pickKind = k => {
    if (!k) { onChange(null); return; }
    if (k === 'ea') { onChange('ea:' + (cur && cur.kind === 'ea' ? cur.table : defaultTable())); return; }
    if (!SIZED.has(k)) { onChange(k); return; }
    const s = okId(k + '.' + sz) ? sz : (SZ.map(x => x[0]).find(x => okId(k + '.' + x)) || 'w');
    onChange(k + '.' + s);
  };
  const plain = MD.filter(m => !m.sz);
  const groups = [
    ['Any mode', noTable ? [] : [['ea', 'ea: any mode, from a table']]],
    ['Registers', plain.filter(m => m.cls === 'reg').map(m => [m.id, m.syn])],
    ['Constants', plain.filter(m => m.cls === 'const' || m.cls === 'spec').map(m => [m.id, m.syn === 'special' ? 'special (R picks)' : m.syn])],
    ['Memory', [...MK.map(k => [k[0], k[1] || '[R + k·size]']), ...plain.filter(m => m.cls === 'mem').map(m => [m.id, m.syn])]],
    ['Your modes', Object.values(S.st.modes).map(m => [m.id, m.syn])],
  ].filter(x => x[1].length);
  return html`<div class="mp">
    <select class="inp mono" id=${id} aria-label="Addressing mode" value=${kind} onChange=${e => pickKind(e.target.value)}>
      ${allowEmpty || !kind ? html`<option value="">(empty)</option>` : ''}
      ${groups.map(([gn, items]) => html`<optgroup label=${gn}>${items.map(([k, label]) => html`<option value=${k} disabled=${!okKind(k)}>${label}</option>`)}</optgroup>`)}
    </select>
    ${kind === 'ea' ? html`<select class="inp tb" aria-label="Mode table" value=${cur.table} onChange=${e => onChange('ea:' + e.target.value)}>
      ${Object.entries(S.st.sets).map(([sid, s]) => html`<option value=${sid} disabled=${!okId('ea:' + sid)}>${s.name}</option>`)}
    </select>` : ''}
    ${SIZED.has(kind) ? html`<select class="inp sz" aria-label="Size" value=${sz} onChange=${e => onChange(kind + '.' + e.target.value)}>
      ${SZ.map(([s, , , label]) => html`<option value=${s} disabled=${!okId(kind + '.' + s)}>${label}</option>`)}
    </select>` : ''}
  </div>`;
}

function Encoding({ p, base, depth, path }) {
  const { parcels, L, opLow } = encoding(p, base, depth, path);
  const In = ins(p.i), M = mode(p.m);
  const extras = [];
  const me = extRange(M ? M.ext : 0), ie = extRange(In.ext);
  if (me[1]) extras.push(`${M.xl || 'mode'}${me[0] !== me[1] ? ` (${me[0]}–${me[1]} parcels)` : me[1] > 1 ? ' (2 parcels)' : ''}`);
  if (ie[1]) extras.push(`${In.xl || 'operand'}${ie[1] > 1 ? ' (2 parcels)' : ''}`);
  const cap0 = depth === 0
    ? (opLow ? ['register byte', 'opcode byte'] : ['opcode byte', 'register byte'])
    : (opLow ? ['opcode byte 2', 'opcode byte 1'] : ['opcode byte 1', 'opcode byte 2']);
  const bitCell = (x, j) => html`<span class=${'bit ' + x.t} style=${x.t === 'f' ? `--fc: var(--fc${x.fi % 6})` : ''}>${x.t === 'f' ? fieldLetter(L.fields[x.fi].n) : x.t === 'u' ? '·' : x.t}</span>`;
  return html`<div class="enc">
    <div class="lbl">Encoding</div>
    ${parcels.map((P, i) => {
      const nib = nibbleText(P, L.fields);
      return html`<div class="parcel">
        <div class="phex">${nib}<small>in memory: ${nib.slice(2)} ${nib.slice(0, 2)}</small></div>
        <div class="bits">${P.slice(0, 8).map(bitCell)}<span></span>${P.slice(8).map(bitCell)}</div>
        ${i === 0 ? html`<div class="bytecap"><span>${cap0[0]}</span><span></span><span>${cap0[1]}</span></div>` : ''}
      </div>`;
    })}
    ${extras.map(x => html`<div class="xp">+ ${x}</div>`)}
    ${L.fields.length ? html`<div class="fkeys">${L.fields.map((f, i) => html`<span style=${`--fc: var(--fc${i % 6})`}><i></i>${f.n}:${f.b}</span>`)}</div>` : ''}
    <div class="facts">${L.B} operand bit${L.B === 1 ? '' : 's'} in the first parcel${L.unused ? `, ${L.unused} spare` : ''} · ${L.span > 1 ? `${L.span} cells` : '1 cell'} · ${lenText(L.len)}</div>
  </div>`;
}

function TableView({ M, In }) {
  const set = S.st.sets[M.table];
  if (!set) return '';
  return html`<ol class="plan" aria-label=${'Mode table ' + set.name}>${pad16(set.slots).map((mid, i) => {
    const m = mid ? mode(mid) : null;
    const e = m ? extRange(m.ext) : [0, 0];
    const why = !m ? 'traps' : m.cls === 'table' ? 'traps: tables don’t nest' : !TABLE_FITS(m) ? `traps: needs ${fbits(parseF(m.f))} bits` : legal(In, m) ? 'traps for ' + In.m : '';
    return html`<li class=${why ? 's-illegal' : 's-ok'}><span class="pc">M=${HEX[i]}</span><span class="pm">${m ? m.syn : '·'}</span><span class="ps">${why || (e[1] ? '+' + (e[0] === e[1] ? e[0] : e[0] + '–' + e[1]) : 'ok')}</span></li>`;
  })}</ol>`;
}

function Pending() {
  const P = S.pending;
  const names = P.hits.map(h => h.p.x ? 'an extension grid' : placeLabel(h.p));
  return html`<div class="conf">
    <div><b>${placeLabel(P.pl)}</b> needs ${P.s > 1 ? `cells ${hex2(P.base)}–${hex2(P.base + P.s - 1)}` : `cell ${hex2(P.base)}`}, which already hold${P.hits.length === 1 ? 's' : ''} ${names.join(', ')}.${P.hits.some(h => h.p.x) ? ' Replacing an extension grid deletes everything in it.' : ''}</div>
    <div class="row gap">
      <button class="btn primary" onClick=${() => tryPlace(P.g, P.byte, P.pl, { replaceBase: P.replaceBase, force: true, label: P.label })}>Replace ${P.hits.length === 1 ? 'it' : 'them'}</button>
      ${P.s > 1 && depthOf(P.g) === 0 ? html`<button class="btn" onClick=${() => tryPlace(P.g, P.byte, { ...P.pl, ov: 'ext' }, { replaceBase: P.replaceBase })}>One cell + extension parcel</button>` : ''}
      <button class="btn" onClick=${() => { S.pending = null; R(); }}>Cancel</button>
    </div>
  </div>`;
}

function Inspector() {
  if (S.ui.def) return html`<${DefEditor}/>`;
  const f = S.ui.focus, g = S.ui.grid;
  if (!f) return html`<div class="ihead"><span class="lbl">Inspector</span></div>
    <p class="hint">Select a cell to write in an instruction, or a row label to fill a whole row with addressing modes.</p>
    <p class="facts">Keys: arrows move, Enter writes in, Delete clears, Ctrl+Z and Ctrl+Shift+Z undo and redo, Esc deselects.</p>`;
  if (f.type === 'row') return html`<${RowPanel} row=${f.row} key=${g + ':r' + f.row}/>`;
  return html`<${CellPanel} b=${f.byte} key=${g + ':c' + f.byte}/>`;
}

function CellPanel({ b }) {
  const g = S.ui.grid, st = S.st, gi = GI(), depth = gi[g]?.depth ?? 0;
  const cov = coverOf(st, g, b);
  const [replacing, setReplacing] = useState(false);
  const [confirmRm, setConfirmRm] = useState(false);
  const [note, setNote] = useState(cov && cov.p.n ? cov.p.n : '');
  const [gname, setGname] = useState(cov && cov.p.x ? st.grids[cov.p.g]?.name || '' : '');
  const base = cov ? cov.base : b, s = cov ? cov.s : 1;
  const head = html`<div class="ihead"><span class="lbl">${!cov ? 'Empty cell' : cov.p.x ? 'Extension' : 'Instruction'}</span><span class="addr">${addrText(g, base, s)}</span></div>`;
  const pend = S.pending && S.pending.g === g ? html`<${Pending}/>` : '';
  const forCell = { g, byte: b, replaceBase: null };

  if (!cov) return html`${head}${pend}
    <${WriteIn} id=${'wi-' + g + '-' + b} placeholder="Write in: ADD [R]+, LSL rd, #n, MVI…"
      onPick=${(x, text) => placeIns(g, b, x, parseMode(x, text), null)} onNew=${mn => openDef(null, forCell, mn)}
      onPickExt=${(x, text) => placeIns(g, b, x, parseMode(x, text), null, 'ext')} cellsFor=${(x, text) => cellsAt(g, x, text)}/>
    <div class="row gap" style="margin-top:10px"><button class="btn" onClick=${() => makeExt(g, b)}>Make an extension grid</button></div>
    <p class="hint" style="margin-top:8px">An empty cell traps as an illegal instruction. ${depth === 0
      ? 'An extension grid turns the register byte into a second opcode byte: 256 more opcodes, with their operands in extension parcels.'
      : 'Another level makes one more byte an opcode byte.'}</p>`;

  if (cov.p.x) {
    const p = cov.p, gr = st.grids[p.g] || {}, n = usedCells(p.g);
    return html`${head}${pend}
      <label class="fld"><span>Name</span><input class="inp" id=${'gname-' + p.g} value=${gname} placeholder="System, floating point…"
        onInput=${e => setGname(e.target.value)} onChange=${e => commit(`Name grid ${addrText(g, base)}`, [{ c: 'grids', k: p.g, v: { ...gr, name: e.target.value.trim() } }])}/></label>
      <p class="facts">${n} of 256 cells used. The byte after ${addrText(g, base)} picks one of 256 opcodes, and their operands go in extension parcels.</p>
      <div class="row gap">
        <button class="btn primary" onClick=${() => openGrid(p.g)}>Open grid</button>
        ${confirmRm
          ? html`<span>Remove it and its ${n} cell${n === 1 ? '' : 's'}?</span>
              <button class="btn danger" onClick=${() => commit(`Remove extension ${addrText(g, base)}`, removeChanges(st, g, base, p))}>Remove</button>
              <button class="btn" onClick=${() => setConfirmRm(false)}>Keep</button>`
          : html`<button class="btn" onClick=${() => setConfirmRm(true)}>Remove…</button>`}
      </div>`;
  }

  const p = cov.p, In = ins(p.i), M = mode(p.m), L = layout(p, depth);
  const why = legal(In, M);
  const replace = (np, label) => tryPlace(g, base, np, { replaceBase: base, label });
  const dupAt = Object.keys(st.cells).filter(k => k !== ck(g, base) && !st.cells[k].x && st.cells[k].i === p.i && (st.cells[k].m || '') === (p.m || ''));
  const saveNote = v => {
    v = v.trim();
    if (v === (p.n || '')) return;
    const q = { ...p };
    if (v) q.n = v; else delete q.n;
    commit(`Note on ${addrText(g, base, s)}`, [{ c: 'cells', k: ck(g, base), v: q }]);
  };
  return html`${head}${pend}
    <div class="plt"><i class=${'sw g-' + In.g}></i><span class="mnbig">${In.m}</span><span class="syn">${synWithMode(In, M)}</span></div>
    <div class="chips" style="margin-top:6px"><${Chips} In=${In}/></div>
    <p class="desc">${In.d}${In.r ? html` <span class="ref">(${In.r})</span>` : ''}</p>
    ${In.ea ? html`<div class="fld"><span>Addressing mode</span>
        <${ModePicker} id=${'mode-' + g + base} value=${p.m} In=${In} onChange=${m => m && replace({ ...p, m }, `Change ${addrText(g, base, s)} to ${In.m} ${synWithMode(In, mode(m))}`)}/>
        ${M ? html`<span class="desc small">${M.d}</span>` : ''}
        ${M && M.cls === 'table' ? html`<${TableView} M=${M} In=${In}/>` : ''}</div>` : ''}
    ${depth === 0 && L.B > 8 ? html`<div class="fld"><span>${L.B} operand bits: ${L.B - 8} more than the register byte holds</span>
      ${L.B <= 16 ? html`<div class="seg">
          <button class=${p.ov !== 'ext' ? 'on' : ''} onClick=${() => { const q = { ...p }; delete q.ov; replace(q, `${placeLabel(p)}: operand bits in the opcode byte`); }}>Take ${L.B - 8} opcode bit${L.B - 8 > 1 ? 's' : ''} (${1 << (L.B - 8)} cells)</button>
          <button class=${p.ov === 'ext' ? 'on' : ''} onClick=${() => replace({ ...p, ov: 'ext' }, `${placeLabel(p)}: operand bits in an extension parcel`)}>Extension parcel</button>
        </div>` : html`<span>They go in an extension parcel.</span>`}
    </div>` : ''}
    <${Encoding} p=${p} base=${base} depth=${depth} path=${gi[g].path}/>
    ${why || L.span !== s || L.len[1] > 3 || dupAt.length ? html`<ul class="probs">
      ${why ? html`<li class="bad">${In.m} with ${M ? M.syn : 'no mode'}: ${why}.</li>` : ''}
      ${L.span !== s ? html`<li class="warn">It now needs ${L.span} cell${L.span > 1 ? 's' : ''}, not ${s}. <button class="link" onClick=${() => replace(p, `Re-place ${placeLabel(p)}`)}>Re-place it</button></li>` : ''}
      ${L.len[1] > 3 ? html`<li class="warn">It’s ${lenText(L.len)}: draft 1 decided on at most 2 extension parcels.</li>` : ''}
      ${dupAt.length ? html`<li class="info">Also encoded at ${dupAt.map(k => { const i = k.lastIndexOf('/'); return addrText(k.slice(0, i), parseInt(k.slice(i + 1), 16)); }).join(', ')}.</li>` : ''}
    </ul>` : ''}
    <label class="fld"><span>Note</span><textarea class="inp" id=${'note-' + g + base} rows="2" value=${note}
      onInput=${e => setNote(e.target.value)} onBlur=${e => saveNote(e.target.value)}></textarea></label>
    <div class="row gap">
      <button class="btn" onClick=${() => { S.ui.wantFocus = true; setReplacing(true); }}>Replace…</button>
      <button class="btn" onClick=${() => openDef(In.id, null)}>Edit definition</button>
      <button class="btn danger" onClick=${() => clearCell(g, base)}>Clear</button>
    </div>
    ${replacing ? html`<div style="margin-top:10px"><${WriteIn} id=${'wr-' + g + '-' + base} placeholder="Replace with…"
      onPick=${(x, text) => placeIns(g, base, x, parseMode(x, text), base)} onNew=${mn => openDef(null, { g, byte: base, replaceBase: base }, mn)}
      onPickExt=${(x, text) => placeIns(g, base, x, parseMode(x, text), base, 'ext')} cellsFor=${(x, text) => cellsAt(g, x, text)}/></div>` : ''}`;
}

function RowPanel({ row }) {
  const g = S.ui.grid, rp = S.ui.rp, sets = S.st.sets;
  const sid = sets[rp.set] ? rp.set : Object.keys(sets)[0];
  const set = sid ? sets[sid] : null;
  const In = rp.i ? ins(rp.i) : null;
  const [confirmClear, setConfirmClear] = useState(false);
  const inRow = inBlock(S.st, g, row * 16, 16);
  const plan = In && In.ea && set ? rowPlan(g, row, In, set.slots, rp.start) : [];
  const nPlace = plan.filter(x => x.status === 'ok' || (x.status === 'busy' && rp.rep) || (x.status === 'illegal' && !rp.skip)).length;
  return html`
    <div class="ihead"><span class="lbl">Row</span><span class="addr">${addrText(g, row * 16, 16).replace(/[0-9A-F]0–[0-9A-F]F$/, HEX[row] + '_')}</span></div>
    <div class="fld"><span>Fill it with</span>
      ${In
        ? html`<div class="chosen"><i class=${'sw g-' + In.g}></i><b>${In.m}</b><span class="syn">${In.syn}</span><button class="link" onClick=${() => { rp.i = null; S.ui.wantFocus = true; R(); }}>change</button></div>`
        : html`<${WriteIn} id=${'rowins-' + row} placeholder="An instruction: ADD, MOV, ST…" onPick=${x => { rp.i = x.id; R(); }}/>`}
    </div>
    ${In && !In.ea ? html`<p class="hint">${In.m} takes no addressing mode, so there is nothing to spread along a row.</p>
      <button class="btn" onClick=${() => tryPlace(g, row * 16, { i: In.id })}>Place it at ${addrText(g, row * 16)}</button>` : ''}
    ${In && In.ea && !set ? html`<p class="hint">There are no mode sets. Make one in the Modes tab.</p>` : ''}
    ${In && In.ea && set ? html`
      <div class="grid2">
        <label>Mode set<select class="inp" id="row-set" value=${sid} onChange=${e => { rp.set = e.target.value; R(); }}>
          ${Object.entries(sets).map(([id, s]) => html`<option value=${id}>${s.name}</option>`)}</select></label>
        <label>Starting at<select class="inp mono" id="row-start" value=${rp.start} onChange=${e => { rp.start = +e.target.value; R(); }}>
          ${[...HEX].map((h, i) => html`<option value=${i}>${HEX[row]}${h}</option>`)}</select></label>
      </div>
      <label class="chk"><input type="checkbox" checked=${rp.skip} onChange=${e => { rp.skip = e.target.checked; R(); }}/> Skip modes ${In.m} can’t take</label>
      <label class="chk"><input type="checkbox" checked=${rp.rep} onChange=${e => { rp.rep = e.target.checked; R(); }}/> Replace cells already in use</label>
      <ol class="plan">${plan.map(it => html`<li class=${'s-' + it.status}><span class="pc">${HEX[row]}${HEX[it.col]}</span><span class="pm">${it.m ? mode(it.m).syn : '·'}</span><span class="ps">${it.why}</span></li>`)}</ol>
      <button class="btn primary" disabled=${!nPlace} onClick=${() => fillRow(g, row, In, set, rp.start, rp)}>Fill ${nPlace} cell${nPlace === 1 ? '' : 's'}</button>` : ''}
    <div class="row gap" style="margin-top:14px">
      ${confirmClear
        ? html`<span>Clear ${inRow.length} placement${inRow.length === 1 ? '' : 's'}${inRow.some(c => c.p.x) ? ', extension grids included' : ''}?</span>
            <button class="btn danger" onClick=${() => { setConfirmClear(false); commit(`Clear row ${HEX[row]}_`, inRow.flatMap(c => removeChanges(S.st, g, c.base, c.p))); }}>Clear</button>
            <button class="btn" onClick=${() => setConfirmClear(false)}>Keep</button>`
        : html`<button class="btn" disabled=${!inRow.length} onClick=${() => setConfirmClear(true)}>Clear row…</button>`}
    </div>
    <p class="hint" style="margin-top:8px">Drag a row label onto another to swap the two rows.</p>`;
}

function DefEditor() {
  const d = S.ui.def, f = d.form;
  const set = (k, v) => { d.form = { ...d.form, [k]: v }; R(); };
  const err = defError(f);
  const B = fbits(parseF(f.f));
  const overridden = d.id && CAT.has(d.id) && S.st.instrs[d.id];
  return html`<div class="def">
    <div class="ihead"><span class="lbl">${d.id ? 'Edit instruction' : 'New instruction'}</span>${d.forCell ? html`<span class="addr">for ${addrText(d.forCell.g, d.forCell.byte)}</span>` : ''}</div>
    <div class="grid2">
      <label>Mnemonic<input class="inp mono" id="def-m" value=${f.m} onInput=${e => set('m', e.target.value)}/></label>
      <label>Group<select class="inp" id="def-g" value=${f.g} onChange=${e => set('g', e.target.value)}>${GROUPS.map(([id, n]) => html`<option value=${id}>${n}</option>`)}</select></label>
      <label class="span2">Operands, as written<input class="inp mono" id="def-syn" value=${f.syn} placeholder="rd, rs   (write ea for the addressing mode)" onInput=${e => set('syn', e.target.value)}/></label>
      <label class="span2">Fields in the first parcel<input class="inp mono" id="def-f" value=${f.f} placeholder="rd:4 rs:4" onInput=${e => set('f', e.target.value)}/>
        <small>name:bits, in order. They fill the register byte first, then low opcode bits. Now ${B} bit${B === 1 ? '' : 's'}.</small></label>
      <label>Addressing mode<select class="inp" id="def-ea" value=${f.ea} onChange=${e => set('ea', e.target.value)}>
        <option value="">none</option><option value="any">any operand</option><option value="mem">memory only</option><option value="addr">an address (like LEA)</option><option value="value">a jump target</option></select></label>
      <label>Extension parcels<select class="inp" id="def-ext" value=${f.ext} onChange=${e => set('ext', e.target.value)}><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label>
      ${f.ext !== '0' ? html`<label class="span2">What they hold<input class="inp mono" id="def-xl" value=${f.xl} placeholder="rel16" onInput=${e => set('xl', e.target.value)}/></label>` : ''}
      <label class="span2">Cell label<input class="inp mono" id="def-cs" value=${f.cs} placeholder="#n" onInput=${e => set('cs', e.target.value)}/></label>
      <label class="span2">Description<textarea class="inp" id="def-d" rows="2" value=${f.d} onInput=${e => set('d', e.target.value)}></textarea></label>
    </div>
    ${err ? html`<p class="err">${err}</p>` : ''}
    <div class="row gap">
      <button class="btn primary" disabled=${!!err} onClick=${saveDef}>${d.forCell ? 'Save and place' : 'Save'}</button>
      <button class="btn" onClick=${() => { S.ui.def = null; R(); }}>Cancel</button>
      ${overridden ? html`<button class="btn" onClick=${() => { S.ui.def = null; commit(`Reset ${f.m} to the catalog`, [{ c: 'instrs', k: d.id, v: null }]); }}>Reset to the catalog</button>` : ''}
    </div>
    ${d.id && CAT.has(d.id) ? html`<p class="facts">Editing a catalog instruction keeps your version in this map. Placements that no longer fit show up under Checks.</p>` : ''}
  </div>`;
}

function Side() {
  const t = S.ui.tab;
  const tab = (id, label) => html`<button role="tab" aria-selected=${t === id} class=${t === id ? 'on' : ''} onClick=${() => { S.ui.tab = id; R(); }}>${label}</button>`;
  return html`<div class="tabs" role="tablist">${tab('instr', 'Instructions')}${tab('modes', 'Modes')}${tab('hist', 'History')}</div>
    ${t === 'instr' ? html`<${Catalog}/>` : t === 'modes' ? html`<${Modes}/>` : html`<${History}/>`}`;
}

function Catalog() {
  const u = S.ui, g = u.grid, f = u.focus;
  const used = usage();
  const target = f && f.type === 'cell' ? f.byte : null;
  const tc = target !== null ? coverOf(S.st, g, target) : null;
  const q = u.q.trim().toLowerCase();
  const list = allIns().filter(x =>
    (!q || (x.m + ' ' + x.syn + ' ' + x.d).toLowerCase().includes(q)) &&
    x.src.some(s => !u.srcOff[s]) &&
    (!u.hideRej || (x.st !== 'rejected' && x.st !== 'notrec')) &&
    (!u.unplaced || !used[x.id]));
  const click = (x, ext) => {
    if (target === null) { u.openIns = u.openIns === x.id ? null : x.id; R(); return; }
    if (tc && tc.p.x) { flash('The selected cell is an extension grid. Pick another cell.'); return; }
    placeIns(g, tc ? tc.base : target, x, null, tc ? tc.base : null, ext ? 'ext' : null);
  };
  return html`<div class="filters">
      <input class="inp" id="cat-q" type="search" placeholder="Search mnemonics and descriptions" value=${u.q} onInput=${e => { u.q = e.target.value; R(); }}/>
      <div class="toggles" role="group" aria-label="Sources">${SRCS.map(([s, l]) => html`<button aria-pressed=${!u.srcOff[s]} class=${u.srcOff[s] ? 'off' : ''} onClick=${() => { u.srcOff[s] = !u.srcOff[s]; R(); }}>${l}</button>`)}</div>
      <label class="chk"><input type="checkbox" checked=${u.hideRej} onChange=${e => { u.hideRej = e.target.checked; R(); }}/> Hide rejected and not recommended</label>
      <label class="chk"><input type="checkbox" checked=${u.unplaced} onChange=${e => { u.unplaced = e.target.checked; R(); }}/> Only what isn’t placed yet</label>
      <p class="hint">${target !== null
        ? html`Click an instruction to place it in <b class="mono">${addrText(g, tc ? tc.base : target, tc ? tc.s : 1)}</b>, or drag it onto any cell. Shift-click keeps a wide one to this cell, with an extension parcel.`
        : 'Select a cell, then click an instruction to place it. Or drag one onto a cell.'}</p>
    </div>
    ${GROUPS.map(([gid, gname]) => {
      const items = list.filter(x => x.g === gid);
      if (!items.length) return '';
      return html`<div><h4 class="gh"><i class=${'sw g-' + gid}></i>${gname}</h4><ul class="cat">
        ${items.map(x => html`<li class=${'ci' + (u.openIns === x.id ? ' open' : '') + (x.st === 'rejected' || x.st === 'notrec' ? ' dim' : '')}
            tabindex="0" draggable="true" title=${x.d} onDragStart=${e => dragStart(e, 'ins:' + x.id)} onDragEnd=${dragEnd}
            onClick=${e => click(x, e.shiftKey)} onKeyDown=${e => { if (e.key === 'Enter') click(x, e.shiftKey); }}>
          <div style="min-width:0"><div class="top1"><b>${x.m}</b><span class="syn">${x.syn}</span></div>
            <div class="cd">${x.d}${x.r ? ` (${x.r})` : ''}</div></div>
          <div class="cr"><${Chips} In=${x} compact=${true}/>${used[x.id] ? html`<span class="used" title="Cells it’s placed in">×${used[x.id]}</span>` : ''}</div>
        </li>`)}</ul></div>`;
    })}
    ${!list.length ? html`<p class="hint">Nothing matches.</p>` : ''}
    <div class="row gap" style="margin-top:12px"><button class="btn" onClick=${() => openDef(null, null, '')}>New instruction…</button></div>`;
}

function SetEditor({ sid }) {
  const s = S.st.sets[sid];
  const [name, setName] = useState(s.name);
  const [del, setDel] = useState(false);
  const setSlot = (i, m) => {
    const slots = pad16(s.slots);
    slots[i] = m || null;
    commit(`${s.name}: slot ${HEX[i]} ${m ? '= ' + mode(m).syn : 'emptied'}`, [{ c: 'sets', k: sid, v: { ...s, slots } }]);
  };
  return html`
    <label class="fld"><span>Name</span><input class="inp" id=${'set-name-' + sid} value=${name} onInput=${e => setName(e.target.value)}
      onChange=${e => { const n = e.target.value.trim(); if (n && n !== s.name) commit(`Rename mode set to ${n}`, [{ c: 'sets', k: sid, v: { ...s, name: n } }]); }}/></label>
    <p class="facts">Slot n fills the column n after the starting column.</p>
    <ol class="slots">${pad16(s.slots).map((m, i) => html`<li><span class="mono facts">${HEX[i]}</span>
      <${ModePicker} id=${'slot-' + sid + i} value=${m} In=${null} allowEmpty=${true} noTable=${true} onChange=${v => setSlot(i, v)}/></li>`)}</ol>
    <div class="row gap">${del
      ? html`<span>Delete this set?</span><button class="btn danger" onClick=${() => { setDel(false); commit(`Delete mode set ${s.name}`, [{ c: 'sets', k: sid, v: null }]); }}>Delete</button><button class="btn" onClick=${() => setDel(false)}>Keep</button>`
      : html`<button class="btn" onClick=${() => setDel(true)}>Delete set…</button>`}</div>`;
}

function ModeDef() {
  const blank = { syn: '', short: '', f: 'R:4', ext: '0', cls: 'mem', wb: false, d: '' };
  const [open, setOpen] = useState(false);
  const [f, setF] = useState(blank);
  if (!open) return html`<div class="row gap" style="margin-top:12px"><button class="btn" onClick=${() => setOpen(true)}>New addressing mode…</button></div>`;
  const set = (k, v) => setF({ ...f, [k]: v });
  const fs = parseF(f.f);
  const err = !f.syn.trim() ? 'Write how the mode looks, like [R + 8k].'
    : fs.some(x => !/^[A-Za-z]\w*$/.test(x.n) || !(x.b >= 1 && x.b <= 16)) ? 'Fields are name:bits, like R:4.' : '';
  const save = () => {
    const id = uid('md');
    commit(`New mode ${f.syn.trim()}`, [{ c: 'modes', k: id, v: {
      id, kind: id, syn: f.syn.trim(), short: (f.short.trim() || f.syn.trim()).replace(/\s+/g, ''), f: f.f.trim(), cls: f.cls,
      ext: +f.ext, xl: 'mode', wb: !!f.wb, src: ['custom'], d: f.d.trim() || 'Your mode',
    } }]);
    setOpen(false); setF(blank);
  };
  return html`<div class="def" style="margin-top:12px">
    <div class="lbl">New addressing mode</div>
    <div class="grid2">
      <label class="span2">Syntax<input class="inp mono" id="md-syn" value=${f.syn} placeholder="[R + 8k]" onInput=${e => set('syn', e.target.value)}/></label>
      <label>Cell label<input class="inp mono" id="md-short" value=${f.short} placeholder="[R+8k]" onInput=${e => set('short', e.target.value)}/></label>
      <label>Fields<input class="inp mono" id="md-f" value=${f.f} onInput=${e => set('f', e.target.value)}/></label>
      <label>Kind<select class="inp" id="md-cls" value=${f.cls} onChange=${e => set('cls', e.target.value)}><option value="reg">register</option><option value="const">constant</option><option value="mem">memory</option></select></label>
      <label>Extension parcels<select class="inp" id="md-ext" value=${f.ext} onChange=${e => set('ext', e.target.value)}><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label>
      <label class="chk span2"><input type="checkbox" checked=${f.wb} onChange=${e => set('wb', e.target.checked)}/> It changes its register, like [R]+</label>
      <label class="span2">Description<input class="inp" id="md-d" value=${f.d} onInput=${e => set('d', e.target.value)}/></label>
    </div>
    ${err ? html`<p class="err">${err}</p>` : ''}
    <div class="row gap"><button class="btn primary" disabled=${!!err} onClick=${save}>Add mode</button><button class="btn" onClick=${() => setOpen(false)}>Cancel</button></div>
  </div>`;
}

function Modes() {
  const u = S.ui, sets = S.st.sets, ids = Object.keys(sets);
  const sid = sets[u.setSel] ? u.setSel : ids[0];
  const mu = modeUsage();
  const newSet = () => { const id = uid('s'); u.setSel = id; commit('New mode set', [{ c: 'sets', k: id, v: { name: 'New set', slots: pad16([]) } }]); };
  const dupSet = () => { const s = sets[sid], id = uid('s'); u.setSel = id; commit(`Duplicate mode set ${s.name}`, [{ c: 'sets', k: id, v: { name: s.name + ' copy', slots: pad16(s.slots) } }]); };
  const row = m => {
    const e = extRange(m.ext);
    const custom = !!S.st.modes[m.id];
    return html`<tr title=${m.d}><td class="mono">${m.syn}</td><td class="n">${fbits(parseF(m.f))}</td><td class="n">${e[0] === e[1] ? e[0] : e[0] + '–' + e[1]}</td>
      <td>${m.src.map(s => SRCL[s] || s).join(' ')}</td><td class="n">${mu[m.id] || ''}${custom && !mu[m.id] ? html` <button class="link" onClick=${() => commit(`Delete mode ${m.syn}`, [{ c: 'modes', k: m.id, v: null }])}>delete</button>` : ''}</td></tr>`;
  };
  const sub = t => html`<tr class="sub"><td colspan="5">${t}</td></tr>`;
  const plain = MD.filter(m => !m.sz);
  return html`
    <div class="ihead"><span class="lbl">Mode sets</span><span class="facts">what “fill a row” lays out</span></div>
    <div class="row gap">
      <select class="inp" id="set-sel" style="flex:1;width:auto" aria-label="Mode set" value=${sid || ''} onChange=${e => { u.setSel = e.target.value; R(); }}>
        ${ids.map(id => html`<option value=${id}>${sets[id].name}</option>`)}</select>
      <button class="btn" onClick=${newSet}>New</button>
      ${sid ? html`<button class="btn" onClick=${dupSet}>Duplicate</button>` : ''}
    </div>
    ${sid ? html`<${SetEditor} sid=${sid} key=${sid + '|' + sets[sid].name}/>` : html`<p class="hint">No mode sets yet.</p>`}
    <div class="ihead" style="margin-top:20px"><span class="lbl">Addressing modes</span></div>
    <p class="hint">Bits: what a mode needs in the first parcel, beside the instruction’s own register. Parcels: the extension parcels it adds. Hover for details.</p>
    <table class="mt">
      <thead><tr><th>Mode</th><th>Bits</th><th>Parcels</th><th>From</th><th>Used</th></tr></thead>
      <tbody>
        ${sub('From a table')}<tr title="The mode number and its register fill the register byte; the table is one of your mode sets"><td class="mono">ea</td><td class="n">8</td><td class="n">0–2</td><td>1b</td><td class="n">${Object.entries(mu).filter(([k]) => k.startsWith('ea:')).reduce((a, [, n]) => a + n, 0) || ''}</td></tr>
        ${sub('Registers and constants')}${plain.filter(m => m.cls !== 'mem').map(row)}
        ${sub('Memory')}${plain.filter(m => m.cls === 'mem').map(row)}${MD.filter(m => m.sz).map(row)}
        ${Object.keys(S.st.modes).length ? html`${sub('Yours')}${Object.values(S.st.modes).map(row)}` : ''}
      </tbody>
    </table>
    <${ModeDef}/>`;
}

function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(t).toLocaleDateString();
}
function History() {
  const shown = S.log.map((e, i) => [e, i]).reverse();
  return html`
    <div class="row gap"><button class="btn" disabled=${!S.cur} onClick=${undo}>Undo</button><button class="btn" disabled=${S.cur >= S.log.length} onClick=${redo}>Redo</button>
      <span class="facts">${S.cur} of ${S.log.length} step${S.log.length === 1 ? '' : 's'}</span></div>
    <p class="hint" style="margin-top:8px">Click a step to go back or forward to it. A new change after an undo drops the undone steps. The history is kept with the map.</p>
    <ol class="hist">
      ${shown.map(([e, i]) => html`<li class=${(i === S.cur - 1 ? 'cur' : '') + (i >= S.cur ? ' undone' : '')} onClick=${() => jumpTo(i + 1)}><span>${e.label}</span><time>${ago(e.time)}</time></li>`)}
      <li class=${S.cur === 0 ? 'cur' : ''} onClick=${() => jumpTo(0)}><span>Start</span><time></time></li>
    </ol>`;
}

function Modal() {
  const u = S.ui;
  const close = () => { S.modal = null; R(); };
  if (S.modal === 'export') {
    const text = u.exp.kind === 'json' ? exportJSON(u.exp.hist) : exportMD();
    return html`<div class="modal-bg" onClick=${close}><div class="modal" role="dialog" aria-label="Export" onClick=${e => e.stopPropagation()}>
      <div class="ihead"><span class="lbl">Export “${S.mapName}”</span><button class="btn small" onClick=${close}>Close</button></div>
      <div class="row gap">
        <div class="seg"><button class=${u.exp.kind === 'json' ? 'on' : ''} onClick=${() => { u.exp.kind = 'json'; R(); }}>JSON</button><button class=${u.exp.kind === 'md' ? 'on' : ''} onClick=${() => { u.exp.kind = 'md'; R(); }}>Markdown tables</button></div>
        ${u.exp.kind === 'json' ? html`<label class="chk"><input type="checkbox" checked=${u.exp.hist} onChange=${e => { u.exp.hist = e.target.checked; R(); }}/> With the undo history</label>` : ''}
      </div>
      <textarea class="inp" id="exp-text" rows="16" readonly value=${text}></textarea>
      <div class="row gap"><button class="btn primary" onClick=${() => copyText(text, 'exp-text')}>Copy</button>
        <span class="facts">${(text.length / 1024).toFixed(1)} KB. JSON imports back as a new map, and you can paste either into a chat with Claude.</span></div>
    </div></div>`;
  }
  return html`<div class="modal-bg" onClick=${close}><div class="modal" role="dialog" aria-label="Import" onClick=${e => e.stopPropagation()}>
    <div class="ihead"><span class="lbl">Import a map</span><button class="btn small" onClick=${close}>Close</button></div>
    <p class="hint">Paste JSON exported from this page, or choose a file. It comes in as a new map; nothing is overwritten.</p>
    <textarea class="inp mono" id="imp-text" rows="12" value=${u.imp} onInput=${e => { u.imp = e.target.value; }}></textarea>
    <input type="file" id="imp-file" accept=".json,application/json" onChange=${e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => { u.imp = String(r.result); u.impErr = ''; R(); };
      r.readAsText(file);
    }}/>
    ${u.impErr ? html`<p class="err">${u.impErr}</p>` : ''}
    <div class="row gap"><button class="btn primary" onClick=${doImport}>Import as a new map</button></div>
  </div></div>`;
}

function App() {
  const [, setTick] = useState(0);
  useEffect(() => {
    R = () => setTick(t => t + 1);
    boot();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  if (!S.ready) return html`<p class="boot">Opening your maps…</p>`;
  return html`<div class="app">
    <${Header}/>
    <div class="main">
      <section class="gp" aria-label="Opcode grid"><${GridPane}/></section>
      <section class="insp panel" aria-label="Inspector"><${Inspector}/></section>
      <section class="side panel" aria-label="Catalog"><${Side}/></section>
    </div>
    ${S.modal ? html`<${Modal}/>` : ''}
    ${S.toast ? html`<div class="toast" role="status">${S.toast}</div>` : ''}
  </div>`;
}

const mount = document.getElementById('app');
mount.textContent = '';
render(html`<${App}/>`, mount);
</script>
