# The machine Fen runs on, for the instruction-level simulator: draft 2 in
# system mode (studies/v2_isa) with RAM, a timer, a video card and an I/O
# card, behind RFC 0029's Bus. Python uses it as heron.native.fen.
[package]
name = "fen-board"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
devices = { path = "../../../infra/devices" }
v2-isa = { path = "../../v2_isa/isa" }

[lints]
workspace = true
