<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="-8 0.4 916 518" width="916" height="518"><style>.diagram{--paper:#FBFAF6;--ink:#171615;--ink-2:#56524B;--ink-3:#8C877D;--rule:#E4E0D8;--spot:#A3195B}
@media (prefers-color-scheme:dark){.diagram{--paper:#141312;--ink:#ECE7DE;--ink-2:#ADA79C;--ink-3:#7E786E;--rule:#2C2926;--spot:#E8609F}}
.diagram text{fill:var(--ink);font-family:'Libre Franklin','Franklin Gothic Medium','Helvetica Neue',Arial,sans-serif;font-size:12px}
.diagram .ink{fill:none;stroke:var(--ink);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.diagram .thin{fill:none;stroke:var(--ink-2);stroke-width:.9}
.diagram .faint{fill:none;stroke:var(--ink-3);stroke-width:.7}
.diagram .dotted{fill:none;stroke:var(--ink-3);stroke-width:.7;stroke-dasharray:1.5 2}
.diagram .dashed{stroke-dasharray:4 3}
.diagram .bus{stroke-width:3.2;stroke-linecap:butt}
.diagram .grid{stroke:var(--rule);stroke-width:1}
.diagram .spot{fill:none;stroke:var(--spot);stroke-width:1.1}
.diagram .paper{fill:var(--paper)}.diagram .hatch{fill:url(#diagram-hatch)}.diagram #diagram-hatch line{stroke:var(--ink-3);stroke-width:.8}
.diagram .solid{fill:var(--ink)}.diagram .solid-2{fill:var(--ink-2)}.diagram .solid-spot{fill:var(--spot)}
.diagram .b{font-weight:600}.diagram .m{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.diagram .s{font-size:11px;fill:var(--ink-2)}.diagram .xs{font-size:10px;fill:var(--ink-3)}.diagram .sp{fill:var(--spot)}
.diagram .halo{paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}</style><defs><pattern id="diagram-hatch" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)"><line x1="2" y1="0" x2="2" y2="4"/></pattern></defs>
<rect class="paper" x="-8" y="0.4" width="916" height="518"/>
<line class="ink bus" x1="0" y1="30" x2="900" y2="30"/>
<text class="b" x="0" y="25">system bus</text>
<line class="ink bus" x1="160" y1="170" x2="900" y2="170"/>
<text class="b" x="160" y="165">T bus</text>
<line class="ink bus" x1="400" y1="280" x2="660" y2="280"/>
<text class="b" x="400" y="275">I/O bus</text>
<line class="ink bus" x1="0" y1="320" x2="900" y2="320"/>
<text class="b" x="0" y="315">R bus</text>
<text class="s" x="120" y="19">A1–A31, BE, START, WRITE</text>
<text class="s" x="330" y="19">D0–D15</text>
<text class="s" x="620" y="19">REQ, GNT, WAIT, ATN0–3</text>
<rect class="ink paper" x="10" y="60" width="140" height="60"/>
<text class="b" x="80" y="79.3" text-anchor="middle">master</text>
<text class="s" x="80" y="94" text-anchor="middle">AL, AHOUT, AH0, AH1</text>
<text class="s" x="80" y="109" text-anchor="middle">16823 × 4</text>
<rect class="ink paper" x="270" y="60" width="190" height="60"/>
<text class="b" x="365" y="79.3" text-anchor="middle">16652</text>
<text class="s" x="365" y="94" text-anchor="middle">BA takes reads, AB drives writes,</text>
<text class="s" x="365" y="109" text-anchor="middle">and the slave&#x27;s data path</text>
<rect class="ink paper" x="620" y="60" width="180" height="60"/>
<text class="b" x="710" y="79.3" text-anchor="middle">bus state, slave side</text>
<text class="s" x="710" y="94" text-anchor="middle">three ranges, address register,</text>
<text class="s" x="710" y="109" text-anchor="middle">WAIT</text>
<rect class="ink paper" x="160" y="200" width="60" height="50"/>
<text class="b" x="190" y="221.8" text-anchor="middle">bridge</text>
<text class="s" x="190" y="236.5" text-anchor="middle">16245</text>
<rect class="ink paper" x="260" y="200" width="120" height="50"/>
<text class="b" x="320" y="221.8" text-anchor="middle">shared RAM</text>
<text class="s" x="320" y="236.5" text-anchor="middle">2 MB, 4 × 512K × 8</text>
<rect class="ink paper" x="440" y="200" width="90" height="50"/>
<text class="b" x="485" y="221.8" text-anchor="middle">I/O bus side</text>
<text class="s" x="485" y="236.5" text-anchor="middle">RFC 0037, 22</text>
<rect class="ink paper" x="600" y="200" width="60" height="50"/>
<text class="b" x="630" y="221.8" text-anchor="middle">swap</text>
<text class="s" x="630" y="236.5" text-anchor="middle">register</text>
<rect class="ink paper" x="720" y="200" width="80" height="50"/>
<text x="760" y="221.5" text-anchor="middle">event ports,</text>
<text class="s" x="760" y="236.5" text-anchor="middle">doorbells</text>
<text class="s" x="670" y="284">D0–D15, A0–A7, SEL and INT × 16</text>
<rect class="ink paper" x="0" y="350" width="140" height="60"/>
<text class="b" x="70" y="369.3" text-anchor="middle">SRAM</text>
<text class="s" x="70" y="384" text-anchor="middle">64K × 16,</text>
<text class="s" x="70" y="399" text-anchor="middle">registers and memory</text>
<text class="s" x="70" y="426.5" text-anchor="middle">address: BANK:REG or X</text>
<rect class="ink paper" x="200" y="350" width="60" height="50"/>
<text class="b" x="230" y="371.8" text-anchor="middle">K ↔ R</text>
<text class="s" x="230" y="386.5" text-anchor="middle">16245</text>
<rect class="ink paper" x="320" y="350" width="130" height="60"/>
<text class="b" x="385" y="369.3" text-anchor="middle">ALU</text>
<text class="s" x="385" y="384" text-anchor="middle">A from R, B from AC</text>
<text class="s" x="385" y="399" text-anchor="middle">4 × 181 + 182</text>
<rect class="ink paper" x="520" y="350" width="130" height="60"/>
<text class="b" x="585" y="369.3" text-anchor="middle">F</text>
<text class="s" x="585" y="384" text-anchor="middle">16823: the result,</text>
<text class="s" x="585" y="399" text-anchor="middle">onto R in the 2nd half</text>
<rect class="ink paper" x="720" y="350" width="140" height="60"/>
<text class="b" x="790" y="369.3" text-anchor="middle">loaded from R</text>
<text class="s" x="790" y="384" text-anchor="middle">AC, X, BANK, AH0, AH1,</text>
<text class="s" x="790" y="399" text-anchor="middle">LC, control</text>
<rect class="ink paper" x="280" y="460" width="60" height="50"/>
<text class="b" x="310" y="481.8" text-anchor="middle">µPC</text>
<text class="s" x="310" y="496.5" text-anchor="middle">4 × 161</text>
<rect class="ink paper" x="380" y="460" width="80" height="50"/>
<text class="b" x="420" y="481.8" text-anchor="middle">microcode</text>
<text class="s" x="420" y="496.5" text-anchor="middle">6 × flash</text>
<rect class="ink paper" x="500" y="460" width="70" height="50"/>
<text class="b" x="535" y="481.8" text-anchor="middle">µIR</text>
<text class="s" x="535" y="496.5" text-anchor="middle">3 × 16823</text>
