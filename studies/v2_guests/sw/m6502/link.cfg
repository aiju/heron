# The 6502 guest's memory: a 64 KB image; code and data from 0x0200, the C
# stack below the console page at 0xE000, the vectors at 0xFFFA.
MEMORY {
    ZP:   file = "",  start = $0002, size = $00FE, type = rw, define = yes;
    RAM:  file = %O,  start = $0000, size = $FFFA, fill = yes, fillval = $00;
    VEC:  file = %O,  start = $FFFA, size = $0006;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = RAM, type = ro, start = $0200;
    LOWCODE:  load = RAM, type = ro, optional = yes;
    ONCE:     load = RAM, type = ro, optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
    VECTORS:  load = VEC, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
