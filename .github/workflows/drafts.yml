# A push to a branch that changes a report: rebuild the website from main
# (pages.yml), which reads each draft from the branch its stub names, so the
# site shows drafts as they're written. Pages only deploys from main, so
# this asks main's workflow to run rather than building here.
name: drafts
on:
  push:
    branches-ignore: [main]
    paths: ["reports/**"]
permissions:
  actions: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
