<title>%%TITLE%% Schematic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sheet list | canvas | selection, one screen; on phones the list
   becomes a picker above the canvas and the selection a panel below it. */
:root {
  --bg: #EEF1EF; --panel: #F8FAF9; --paper: #FFFFFF; --fg: #1B2125; --muted: #5F696E;
  --rule: #D2D9D8; --accent: #0B6B76; --accent-soft: #D4ECEE;
  --wire: #33414A; --bus: #2E5C7A; --sym: #1B2125; --sym-fill: #FBFCFB; --chip-fill: #F4F7F6;
  --sel: #D9480F; --flag: #E7EEF2; --flag-ink: #29485A; --rail: #8A949A; --dim: 0.22;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1417; --panel: #141A1E; --paper: #12181B; --fg: #DCE3E6; --muted: #8D989E;
  --rule: #273036; --accent: #5BC3CF; --accent-soft: #163A40;
  --wire: #A9B9C2; --bus: #7FB2D3; --sym: #D5DEE2; --sym-fill: #171E22; --chip-fill: #1A2227;
  --sel: #FF8A4C; --flag: #1E2B33; --flag-ink: #A9CBE0; --rail: #6C777D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1417; --panel: #141A1E; --paper: #12181B; --fg: #DCE3E6; --muted: #8D989E;
  --rule: #273036; --accent: #5BC3CF; --accent-soft: #163A40;
  --wire: #A9B9C2; --bus: #7FB2D3; --sym: #D5DEE2; --sym-fill: #171E22; --chip-fill: #1A2227;
  --sel: #FF8A4C; --flag: #1E2B33; --flag-ink: #A9CBE0; --rail: #6C777D; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; margin: 0; }
.app { height: 100%; display: grid; grid-template-columns: 250px minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr); }
header.top { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--panel); }
header.top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
header.top .where { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 160px; }
.search { position: relative; flex: 0 1 300px; min-width: 160px; }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--fg); }
.search input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results { position: absolute; top: 100%; right: 0; left: 0; margin-top: 4px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; max-height: 360px; overflow: auto; z-index: 5; box-shadow: 0 6px 24px rgb(0 0 0 / 0.12); }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); font: inherit; font-size: 12.5px; padding: 6px 10px; cursor: pointer; }
.results button:hover, .results button.on { background: var(--accent-soft); }
.results .k { color: var(--muted); font-size: 11px; margin-right: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.zoom { display: flex; gap: 4px; }
button.tool { font: inherit; font-size: 13px; min-width: 32px; height: 30px; border: 1px solid var(--rule); background: var(--paper); color: var(--fg); border-radius: 6px; cursor: pointer; padding: 0 8px; }
button.tool:hover { border-color: var(--accent); }
nav.sheets { overflow: auto; border-right: 1px solid var(--rule); background: var(--panel); padding: 10px 8px 24px max(8px, env(safe-area-inset-left, 0px)); }
nav.sheets h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 14px 8px 6px; font-weight: 600; display: flex; justify-content: space-between; }
nav.sheets h2 span { color: var(--muted); font-weight: 500; }
nav.sheets button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
nav.sheets button span { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
nav.sheets button:hover { background: var(--accent-soft); }
nav.sheets button.on { background: var(--accent); color: var(--paper); }
nav.sheets button.on span { color: var(--paper); }
#picker { display: none; }
main.canvas { position: relative; min-width: 0; min-height: 0; background: var(--paper); overflow: hidden; }
main.canvas svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
main.canvas svg.drag { cursor: grabbing; }
.status { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--paper); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.overview { position: absolute; inset: 0; overflow: auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.overview:focus { outline: none; }   /* a scroller; its buttons show focus */
.overview p.lead { max-width: 64ch; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 1100px; }
.slot { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--panel); display: grid; gap: 6px; align-content: start; }
.slot h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.slot h3 span { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.slot .s { font-family: var(--f-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.04em; }
.slot button { text-align: left; border: 0; background: none; color: var(--fg); font: inherit; font-size: 13px; padding: 3px 0; cursor: pointer; display: flex; justify-content: space-between; }
.slot button:hover { color: var(--accent); }
.slot button span { color: var(--muted); font-size: 12px; }
aside.info { overflow: auto; border-left: 1px solid var(--rule); background: var(--panel); padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; font-size: 13px; }
aside.info h2 { font-family: var(--f-mono); font-size: 15px; margin: 0 0 4px; word-break: break-all; }
aside.info .sub { color: var(--muted); margin-bottom: 12px; line-height: 1.45; }
aside.info h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 16px 0 6px; font-weight: 600; }
aside.info .hint { color: var(--muted); line-height: 1.55; }
aside.info .hint b { color: var(--fg); font-weight: 600; }
aside.info ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
aside.info li button, a.net { border: 0; background: none; padding: 3px 4px; margin: 0 -4px; border-radius: 4px; color: var(--fg); font: inherit; text-align: left; cursor: pointer; width: 100%; display: grid; gap: 1px; }
aside.info li button:hover { background: var(--accent-soft); }
aside.info li .p { font-family: var(--f-mono); font-size: 12.5px; }
aside.info li .q { color: var(--muted); font-size: 11.5px; }
table.pins { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.pins td { padding: 2px 6px 2px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.pins td.k { color: var(--muted); font-size: 11px; }
table.pins button { border: 0; background: none; padding: 0; color: var(--accent); font-family: var(--f-mono); font-size: 12px; cursor: pointer; text-align: left; word-break: break-all; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--rule); border-radius: 10px; padding: 0 7px; margin: 0 4px 4px 0; color: var(--muted); }
/* the drawing */
svg text { font-family: var(--f-mono); }
.sym rect.box { fill: var(--chip-fill); stroke: var(--sym); stroke-width: 1.2; }
.sym .ref { font-size: 11.5px; font-weight: 600; fill: var(--fg); }
.sym .part { font-size: 10.5px; fill: var(--muted); }
.sym .pin { font-size: 10.5px; fill: var(--fg); }
.sym .pin.bus { font-weight: 600; }
.sym path.g, .sym circle.g { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.3; }
.sym .stub { stroke: var(--sym); stroke-width: 1.3; }
.sym .gref { font-size: 9px; fill: var(--muted); }
.sym .mark { fill: none; stroke: var(--sym); stroke-width: 1; }
.sym:hover rect.box, .sym:hover path.g { stroke: var(--accent); }
.sym { cursor: pointer; }
.w { fill: none; stroke: var(--wire); stroke-width: 1.25; }
.w.bus { stroke: var(--bus); stroke-width: 2.6; }
.hit { fill: none; stroke: transparent; stroke-width: 9; cursor: pointer; }
.jn { fill: var(--wire); }
.flag path { fill: var(--flag); stroke: var(--flag-ink); stroke-width: 0.9; }
.flag text { font-size: 10.5px; fill: var(--flag-ink); }
.flag { cursor: pointer; }
.flag.rail path { fill: none; stroke: none; }
.flag.rail text { fill: var(--rail); }
.busn { font-size: 9.5px; fill: var(--bus); }
svg.dim .w:not(.on), svg.dim .jn:not(.on) { opacity: var(--dim); }
.w.on { stroke: var(--sel); }
.jn.on { fill: var(--sel); }
.flag.on path { stroke: var(--sel); stroke-width: 1.6; }
.flag.on text { fill: var(--sel); }
.sym.on rect.box, .sym.on path.g { stroke: var(--sel); stroke-width: 2; }
.port.on { stroke: var(--sel); stroke-width: 3; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(300px, 1fr) auto; }
  nav.sheets { display: none; }
  #picker { display: block; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--rule); }
  #picker select { width: 100%; font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--fg); }
  aside.info { border-left: 0; border-top: 1px solid var(--rule); max-height: 42vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: no-preference) { #view { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>%%TITLE%%</h1>
    <div class="where" id="where"></div>
    <div class="search"><input id="q" type="search" placeholder="Find a chip, part or net" autocomplete="off" aria-label="Find a chip, part or net"><div class="results" id="results" hidden></div></div>
    <div class="zoom"><button class="tool" id="zout" aria-label="Zoom out">−</button><button class="tool" id="zfit">Fit</button><button class="tool" id="zin" aria-label="Zoom in">+</button></div>
  </header>
  <div id="picker"><select id="pick" aria-label="Sheet"></select></div>
  <nav class="sheets" id="nav" aria-label="Sheets"></nav>
  <main class="canvas" id="canvas">
    <svg id="sch" role="img" aria-label="Schematic sheet"><g id="view"></g></svg>
    <div class="overview" id="overview" hidden></div>
    <div class="status" id="status"></div>
  </main>
  <aside class="info" id="info"></aside>
</div>

<script src="%%ELK%%"></script>
<script type="application/json" id="data">%%DATA%%</script>
<script>
(function () {
  const M = JSON.parse(document.getElementById("data").textContent);
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const svg = $("sch"), view = $("view");
  const sheetsById = {}; M.sheets.forEach((s, i) => { s.index = i; sheetsById[s.id] = s; });
  const cardName = {}; M.cards.forEach((c) => { cardName[c.id] = c.name; });
  const layouts = {};
  let current = null, sel = null, tf = { x: 0, y: 0, k: 1 }, bbox = null;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, attrs, html) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cardOf = (ref) => (ref.indexOf(".") > 0 ? ref.split(".")[0] : "");
  const local = (name, card) => (card && name.startsWith(card + ".") ? name.slice(card.length + 1) : name);
  const netLabel = (n) => n;     // nets keep their full names: CPU.DQB, or bus lines like RDY_n
  const sheetTitle = (s) => `${cardName[s.card] || s.card} › ${s.name}`;

  // ---- navigation -------------------------------------------------------------
  const nav = $("nav"), pick = $("pick");
  function buildNav() {
    const ov = h("button", {}, `System overview <span></span>`);
    ov.onclick = () => showOverview();
    nav.appendChild(ov);
    pick.appendChild(h("option", { value: "overview" }, "System overview"));
    for (const c of M.cards) {
      const sheets = M.sheets.filter((s) => s.card === c.id);
      const total = c.chips;
      nav.appendChild(h("h2", {}, `${esc(c.name)} <span>${total} chips</span>`));
      const og = h("optgroup", { label: c.name });
      for (const s of sheets) {
        const b = h("button", { "data-sheet": s.id }, `${esc(s.name)} <span>${s.chips}</span>`);
        b.onclick = () => show(s.id);
        nav.appendChild(b);
        og.appendChild(h("option", { value: s.id }, s.name));
      }
      pick.appendChild(og);
    }
    pick.onchange = () => (pick.value === "overview" ? showOverview() : show(pick.value));
  }
  function markNav(id) {
    nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", (b.dataset.sheet || "overview") === id));
    pick.value = id;
    try { history.replaceState(null, "", id === "overview" ? "#overview" : "#s" + sheetsById[id].index); } catch (e) {}
  }

  function showOverview() {
    current = null;
    svg.hidden = true;
    const ov = $("overview");
    ov.hidden = false;
    ov.innerHTML = "";
    $("where").textContent = "System overview";
    $("status").textContent = "";
    ov.appendChild(h("p", { class: "lead" }, `${M.cards.reduce((a, c) => a + c.chips, 0)} chips on ${M.sheets.length} sheets, one for each section of the design. Pick a sheet; click a wire, a pin label or a chip to see where it goes. Labels at the edge of a chip lead to the rest of a net on other sheets.`));
    const grid = h("div", { class: "slots" });
    for (const c of M.cards) {
      const sheets = M.sheets.filter((s) => s.card === c.id);
      const total = c.chips;
      const box = h("div", { class: "slot" });
      box.appendChild(h("div", { class: "s" }, esc(c.id)));
      box.appendChild(h("h3", {}, `${esc(c.name)} <span>${total} chips</span>`));
      for (const s of sheets) {
        const b = h("button", {}, `${esc(s.name)} <span>${s.chips}</span>`);
        b.onclick = () => show(s.id);
        box.appendChild(b);
      }
      grid.appendChild(box);
    }
    ov.appendChild(grid);
    markNav("overview");
    infoHint();
  }

  // ---- layout -----------------------------------------------------------------
  const elk = typeof ELK !== "undefined" ? new ELK() : null;
  function graphFor(sheet) {
    const children = sheet.symbols.map((id) => {
      const s = M.symbols[id];
      return {
        id, width: s.w, height: s.h,
        layoutOptions: {
          "elk.portConstraints": "FIXED_POS",
          "elk.margins": `[top=${s.kind === "gate" ? 12 : 4},left=${s.ml + 4},bottom=4,right=${s.mr + 4}]`,
        },
        ports: s.ports.map((p, k) => ({
          id: `${id}|${k}`, x: p.x, y: p.y, width: 0, height: 0,
          layoutOptions: { "elk.port.side": p.side === "W" ? "WEST" : "EAST" },
        })),
      };
    });
    const edges = sheet.wires.map((w, i) => ({
      id: `e${i}`, sources: [`${w.from[0]}|${w.from[1]}`], targets: [`${w.to[0]}|${w.to[1]}`],
    }));
    return {
      id: "root",
      layoutOptions: {
        "elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.edgeRouting": "ORTHOGONAL",
        "elk.layered.spacing.nodeNodeBetweenLayers": "64", "elk.spacing.nodeNode": "26",
        "elk.spacing.edgeEdge": "7", "elk.spacing.edgeNode": "12",
        "elk.layered.spacing.edgeEdgeBetweenLayers": "7", "elk.layered.spacing.edgeNodeBetweenLayers": "12",
        "elk.layered.mergeEdges": "true", "elk.padding": "[top=40,left=40,bottom=40,right=40]",
        "elk.spacing.componentComponent": "90",
        "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
        "elk.layered.crossingMinimization.thoroughness": "12",
      },
      children, edges,
    };
  }
  async function layout(sheet) {
    if (layouts[sheet.id]) return layouts[sheet.id];
    if (!elk) throw new Error("The layout library didn't load, so sheets can't be drawn.");
    const res = await elk.layout(graphFor(sheet));
    layouts[sheet.id] = res;
    return res;
  }

  // ---- drawing ----------------------------------------------------------------
  function gateShape(g, s) {
    const h = s.h, x0 = 8, inv = s.inv ? 7 : 0, x1 = s.w - 6 - inv;
    const body = el("g", {}, g);
    let d, back = x0;
    if (s.fn === "and") {
      const r = h / 2, xm = Math.max(x0 + 4, x1 - r);
      d = `M${x0},0 H${xm} A${r},${r} 0 0 1 ${xm},${h} H${x0} Z`;
    } else if (s.fn === "or" || s.fn === "xor") {
      const xo = s.fn === "xor" ? x0 + 4 : x0;
      d = `M${xo},0 Q${x1 - 8},0 ${x1},${h / 2} Q${x1 - 8},${h} ${xo},${h} Q${xo + 8},${h / 2} ${xo},0 Z`;
      back = xo + 4;
      if (s.fn === "xor") el("path", { d: `M${x0 - 1},0 Q${x0 + 7},${h / 2} ${x0 - 1},${h}`, class: "mark" }, body);
    } else {
      d = `M${x0},2 L${x1},${h / 2} L${x0},${h - 2} Z`;
    }
    el("path", { d, class: "g" }, body);
    if (s.inv) el("circle", { cx: x1 + 3.5, cy: h / 2, r: 3.2, class: "g" }, body);
    if (s.schmitt) el("path", { d: `M${x0 + 6},${h / 2 + 3} h5 v-6 h3 M${x0 + 9},${h / 2 + 3} v-6 h5`, class: "mark" }, body);
    if (s.oc) el("path", { d: `M${x1 - 12},${h / 2 - 3} l3,3 l-3,3 l-3,-3 z`, class: "mark" }, body);
    s.ports.forEach((p) => {
      if (p.side === "W") el("line", { x1: 0, y1: p.y, x2: back, y2: p.y, class: "stub" }, g);
      else el("line", { x1: x1 + inv, y1: p.y, x2: s.w, y2: p.y, class: "stub" }, g);
    });
    el("text", { x: x0, y: -4, class: "gref" }, g).textContent = `${local(s.ref, cardOf(s.ref))}${s.ports.length ? "" : ""}`;
  }
  function chipShape(g, s) {
    el("rect", { x: 0, y: 0, width: s.w, height: s.h, rx: 3, class: "box" }, g);
    const card = cardOf(s.ref);
    el("text", { x: 7, y: 13, class: "ref" }, g).textContent = local(s.ref, card);
    el("text", { x: 7, y: 25, class: "part" }, g).textContent = s.part;
    s.ports.forEach((p) => {
      const bus = (p.nets || []).length > 1;
      const t = el("text", { x: p.side === "W" ? 6 : s.w - 6, y: p.y + 3.5, class: "pin" + (bus ? " bus" : ""), "text-anchor": p.side === "W" ? "start" : "end" }, g);
      t.textContent = p.pin;
    });
    const tt = el("title", {}, g);
    tt.textContent = `${s.ref}: ${s.part}${s.desc ? " — " + s.desc : ""}`;
  }
  function flag(parent, s, p, k, nx, ny) {
    if (!p.off) return;
    const w = p.label_w - 6, x = nx + p.x, y = ny + p.y;
    const g = el("g", { class: "flag" + (p.rail ? " rail" : ""), "data-sym": s.id, "data-port": k }, parent);
    if (p.side === "W") {
      const x0 = x - 4 - w;
      el("path", { d: `M${x0},${y - 7} H${x - 10} L${x - 4},${y} L${x - 10},${y + 7} H${x0} Z` }, g);
      el("text", { x: x0 + 4, y: y + 3.5 }, g).textContent = p.off;
    } else {
      const x0 = x + 4;
      el("path", { d: `M${x0},${y} L${x0 + 6},${y - 7} H${x0 + w} V${y + 7} H${x0 + 6} Z` }, g);
      el("text", { x: x0 + 9, y: y + 3.5 }, g).textContent = p.off;
    }
    if (!p.rail) g.onclick = (ev) => { ev.stopPropagation(); selectNets(p.nets, { sym: s.id, port: k }); };
  }
  function draw(sheet, lay) {
    view.innerHTML = "";
    const wires = el("g", {}, view), syms = el("g", {}, view), flags = el("g", {}, view);
    const pos = {};
    for (const c of lay.children) pos[c.id] = c;
    (lay.edges || []).forEach((e, i) => {
      const w = sheet.wires[i];
      const bus = w.nets.length > 1;
      for (const sec of e.sections || []) {
        const pts = [sec.startPoint, ...(sec.bendPoints || []), sec.endPoint].map((q) => `${q.x},${q.y}`).join(" ");
        el("polyline", { points: pts, class: "w" + (bus ? " bus" : ""), "data-w": i }, wires);
        const hit = el("polyline", { points: pts, class: "hit", "data-w": i }, wires);
        hit.onclick = (ev) => { ev.stopPropagation(); selectNets(w.nets, { wire: i }); };
        const t = el("title", {}, hit);
        t.textContent = w.nets.length > 1 ? `${w.nets.length} nets: ${w.nets.slice(0, 6).join(", ")}${w.nets.length > 6 ? " …" : ""}` : w.nets[0];
        if (bus) {
          const a = sec.startPoint, b = (sec.bendPoints && sec.bendPoints[0]) || sec.endPoint;
          if (Math.abs(b.x - a.x) > 30) {
            const mx = a.x + 14;
            el("line", { x1: mx - 4, y1: a.y + 5, x2: mx + 4, y2: a.y - 5, class: "w bus", "data-w": i }, wires);
            el("text", { x: mx + 6, y: a.y - 4, class: "busn" }, wires).textContent = w.nets.length;
          }
        }
      }
      for (const j of e.junctionPoints || []) el("circle", { cx: j.x, cy: j.y, r: 2.6, class: "jn", "data-w": i }, wires);
    });
    for (const id of sheet.symbols) {
      const s = M.symbols[id], c = pos[id];
      const g = el("g", { class: "sym", transform: `translate(${c.x},${c.y})`, "data-sym": id }, syms);
      if (s.kind === "gate") gateShape(g, s); else chipShape(g, s);
      g.onclick = (ev) => { ev.stopPropagation(); selectSymbol(id); };
      s.ports.forEach((p, k) => flag(flags, s, p, k, c.x, c.y));
    }
    const bb = view.getBBox();               // the drawing, labels included
    bbox = { x: bb.x - 20, y: bb.y - 20, w: bb.width + 40, h: bb.height + 40 };
  }

  // ---- pan and zoom -------------------------------------------------------------
  function apply() { view.setAttribute("transform", `translate(${tf.x},${tf.y}) scale(${tf.k})`); }
  function fit() {
    if (!bbox) return;
    const r = svg.getBoundingClientRect(), h = r.height - 28;   // the status line sits below
    const k = Math.min(r.width / bbox.w, h / bbox.h, 1.6);
    tf = { k, x: (r.width - bbox.w * k) / 2 - bbox.x * k, y: Math.max(0, (h - bbox.h * k) / 2) - bbox.y * k };
    apply();
  }
  function zoomAt(f, cx, cy) {
    const k = Math.min(6, Math.max(0.08, tf.k * f));
    tf.x = cx - (cx - tf.x) * (k / tf.k); tf.y = cy - (cy - tf.y) * (k / tf.k); tf.k = k;
    apply();
  }
  function center(x, y) {
    const r = svg.getBoundingClientRect();
    if (tf.k < 0.8) tf.k = 1;
    tf.x = r.width / 2 - x * tf.k; tf.y = r.height / 2 - y * tf.k;
    apply();
  }
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  const ptrs = new Map(); let last = null, moved = false, pinch = null;
  svg.addEventListener("pointerdown", (e) => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { last = { x: e.clientX, y: e.clientY }; moved = false; }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  svg.addEventListener("pointermove", (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      const r = svg.getBoundingClientRect();
      zoomAt(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      pinch = d; moved = true; return;
    }
    if (!last) return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) { moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add("drag"); }
    tf.x += dx; tf.y += dy; last = { x: e.clientX, y: e.clientY }; apply();
  });
  const up = (e) => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) { last = null; svg.classList.remove("drag"); }
  };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("click", (e) => { if (moved) { moved = false; e.stopPropagation(); return; } clearSel(); }, true);
  $("zin").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
  $("zout").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
  $("zfit").onclick = fit;
  window.addEventListener("resize", () => { if (current) fit(); });

  // ---- sheets -------------------------------------------------------------------
  async function show(id, then) {
    const sheet = sheetsById[id];
    if (!sheet) return showOverview();
    current = sheet;
    $("overview").hidden = true;
    svg.hidden = false;
    markNav(id);
    $("where").textContent = sheetTitle(sheet);
    $("status").textContent = layouts[id] ? "" : "Laying out…";
    view.innerHTML = "";
    try {
      const lay = await layout(sheet);
      if (current !== sheet) return;
      draw(sheet, lay);
      $("status").textContent = `${sheet.chips} chips · ${sheet.symbols.length} symbols · ${sheet.wires.length} wires`;
      fit();
      if (then) then(); else restyle();     // a selected net stays selected from sheet to sheet
    } catch (err) {
      $("status").textContent = String(err.message || err);
    }
  }

  // ---- selection ------------------------------------------------------------------
  function clearSel() { sel = null; restyle(); infoHint(); }
  function restyle() {
    const on = new Set(sel && sel.nets ? sel.nets : []);
    svg.classList.toggle("dim", on.size > 0);
    view.querySelectorAll("[data-w]").forEach((e) => {
      const w = current && current.wires[+e.dataset.w];
      e.classList.toggle("on", !!w && w.nets.some((n) => on.has(n)));
    });
    view.querySelectorAll(".flag").forEach((f) => {
      const p = M.symbols[f.dataset.sym].ports[+f.dataset.port];
      f.classList.toggle("on", p.nets.some((n) => on.has(n)));
    });
    view.querySelectorAll(".sym").forEach((g) => g.classList.toggle("on", !!sel && sel.sym === g.dataset.sym));
  }
  function endLabel(e) {
    const s = M.symbols[e[0]];
    const sh = sheetsById[s.sheet];
    return { s, sh, text: `${local(s.ref, cardOf(s.ref))}${s.kind === "gate" ? "" : ""} ${e[2]}`, where: sh ? sheetTitle(sh) : "" };
  }
  function goTo(symId, nets) {
    const s = M.symbols[symId];
    const run = () => {
      sel = { nets, sheet: s.sheet };
      restyle();
      const c = layouts[s.sheet].children.find((x) => x.id === symId);
      if (c) center(c.x + c.width / 2, c.y + c.height / 2);
    };
    if (current && current.id === s.sheet) run(); else show(s.sheet, run);
  }
  function selectNets(nets, ctx) {
    sel = { nets, sheet: current && current.id, sym: null };
    restyle();
    const info = $("info");
    info.innerHTML = "";
    if (nets.length > 1) {
      info.appendChild(h("h2", {}, `${nets.length} nets`));
      info.appendChild(h("div", { class: "sub" }, "A bus: numbered nets drawn as one wire."));
      const ul = h("ul");
      nets.forEach((n) => { const li = h("li"); const b = h("button", {}, `<span class="p">${esc(n)}</span>`); b.onclick = () => selectNets([n]); li.appendChild(b); ul.appendChild(li); });
      info.appendChild(ul);
      return;
    }
    const n = nets[0], d = M.nets[n] || { drivers: [], loads: [] };
    info.appendChild(h("h2", {}, esc(n)));
    const tags = [];
    if (!cardOf(n) || !M.cards.some((c) => c.id === cardOf(n))) tags.push("a bus line, between cards");
    if (d.pulled) tags.push("pulled up");
    if (d.tied) tags.push(`tied to ${d.tied}`);
    info.appendChild(h("div", { class: "sub" }, tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")));
    const list = (title, ends) => {
      if (!ends.length) return;
      info.appendChild(h("h3", {}, `${title} (${ends.length})`));
      const ul = h("ul");
      ends.forEach((e) => {
        const L = endLabel(e);
        const li = h("li");
        const b = h("button", {}, `<span class="p">${esc(L.text)}</span><span class="q">${esc(L.where)} · ${esc(L.s.part)}</span>`);
        b.onclick = () => goTo(e[0], [n]);
        li.appendChild(b); ul.appendChild(li);
      });
      info.appendChild(ul);
    };
    const drv = d.drivers, ld = d.loads.filter((e) => !drv.some((x) => x[0] === e[0] && x[2] === e[2]));
    list("Driven by", drv);
    list("Goes to", ld);
  }
  function selectSymbol(id) {
    const s = M.symbols[id];
    sel = { nets: [], sheet: s.sheet, sym: id };
    restyle();
    const info = $("info");
    info.innerHTML = "";
    const card = cardOf(s.ref);
    info.appendChild(h("h2", {}, esc(local(s.ref, card)) + (s.kind === "gate" ? ` <span style="color:var(--muted);font-weight:400">gate ${s.sec}</span>` : "")));
    const desc = s.kind === "gate" ? `One gate of a ${esc(s.part)}.` : esc(s.desc || "");
    info.appendChild(h("div", { class: "sub" }, `<b>${esc(s.part)}</b>${desc ? " · " + desc : ""}<br>${esc(sheetTitle(sheetsById[s.sheet]))}`));
    info.appendChild(h("h3", {}, "Pins"));
    const t = h("table", { class: "pins" });
    s.ports.forEach((p) => {
      const tr = h("tr");
      tr.appendChild(h("td", {}, `<span style="font-family:var(--f-mono)">${esc(p.pin)}</span>`));
      tr.appendChild(h("td", { class: "k" }, esc(p.kind)));
      const td = h("td");
      p.nets.forEach((n, i) => {
        if (n === "GND" || n === "VCC") { td.appendChild(h("span", { style: "color:var(--muted);font-family:var(--f-mono);font-size:12px" }, n)); }
        else { const b = h("button", {}, esc(n)); b.onclick = () => selectNets([n]); td.appendChild(b); }
        if (i < p.nets.length - 1) td.appendChild(document.createTextNode(" "));
      });
      tr.appendChild(td);
      t.appendChild(tr);
    });
    info.appendChild(t);
  }
  function infoHint() {
    const info = $("info");
    info.innerHTML = `<h3>How to read it</h3><p class="hint">Each sheet is one section of the design. Gates are drawn one by one, so a 74F00 package can appear on several sheets; other chips are boxes with inputs on the left and outputs on the right.</p>
      <p class="hint"><b>Thick wires</b> are buses: numbered nets that run together, with their count. <b>Labels</b> at a pin lead off the sheet; click one, or a wire, to see every end of the net, across sheets and cards. Click a chip for its pins.</p>
      <p class="hint">Drag to pan, scroll or pinch to zoom. Rails and pull-ups aren't drawn: a pin tied to one says GND or VCC.</p>`;
  }

  // ---- search -----------------------------------------------------------------------
  const q = $("q"), results = $("results");
  const index = [];
  for (const id in M.symbols) {
    const s = M.symbols[id];
    if (s.kind === "gate" && s.sec !== 1 && index.some((x) => x.ref === s.ref)) continue;
    index.push({ k: "chip", ref: s.ref, text: `${s.ref} ${s.part}`, label: `${s.ref} · ${s.part}`, go: () => { goTo(id, []); selectSymbol(id); } });
  }
  for (const n in M.nets) index.push({ k: "net", text: n, label: n, go: () => { const d = M.nets[n]; const e = d.drivers[0] || d.loads[0]; if (e) goTo(e[0], [n]); selectNets([n]); } });
  for (const s of M.sheets) index.push({ k: "sheet", text: sheetTitle(s), label: sheetTitle(s), go: () => show(s.id) });
  let hits = [], hi = 0;
  function search() {
    const t = q.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!t) { results.hidden = true; return; }
    hits = index.filter((x) => x.text.toLowerCase().includes(t)).sort((a, b) => {
      const ea = a.text.toLowerCase() === t || a.text.toLowerCase().endsWith("." + t), eb = b.text.toLowerCase() === t || b.text.toLowerCase().endsWith("." + t);
      return (eb - ea) || a.text.length - b.text.length;
    }).slice(0, 40);
    hi = 0;
    hits.forEach((x, i) => {
      const b = h("button", { class: i === 0 ? "on" : "" }, `<span class="k">${x.k}</span>${esc(x.label)}`);
      b.onclick = () => { results.hidden = true; x.go(); };
      results.appendChild(b);
    });
    results.hidden = hits.length === 0;
  }
  q.addEventListener("input", search);
  q.addEventListener("keydown", (e) => {
    if (results.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      hi = (hi + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
      [...results.children].forEach((b, i) => b.classList.toggle("on", i === hi));
    } else if (e.key === "Enter" && hits[hi]) { results.hidden = true; hits[hi].go(); }
    else if (e.key === "Escape") { results.hidden = true; }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) results.hidden = true; });

  // ---- start -------------------------------------------------------------------------
  buildNav();
  const m = /^#s(\d+)$/.exec(location.hash || "");
  if (m && M.sheets[+m[1]]) show(M.sheets[+m[1]].id); else showOverview();
})();
</script>
