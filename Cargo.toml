# The Rust engines (RFC 0015): one workspace for every crate in the
# repository. Reusable engines are crates in infra/, the current design's go
# in isa/ and tools/, and heron/bindings makes them one Python module.
[workspace]
resolver = "3"
members = ["heron/bindings"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-build-config = "0.29"

[workspace.lints.rust]
unsafe_code = "deny"
