# The Rust engines (RFC 0015): one workspace for every crate in the
# repository. Reusable engines are crates in infra/, the current design's go
# in isa/ and tools/, and heron/bindings makes them one Python module.
[workspace]
resolver = "3"
members = ["heron/bindings", "infra/devices", "infra/hwsim", "infra/pcbroute", "infra/sisim", "infra/toolchain", "studies/egret_gui/display", "studies/egret_gui/web", "studies/fen/board", "studies/v1b_system/model", "studies/v1_isa/isa", "studies/v2_isa/isa"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-build-config = "0.29"
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[workspace.lints.rust]
unsafe_code = "deny"
